# Builds the signed Android App Bundle Google Play takes — by hand, never on a push.
#
# REL-2's second half. `ci.yml` runs `assembleRelease` on every pull request so R8 is exercised,
# and it must keep doing so on a machine that holds no key. This workflow is the one that *does*
# hold the key, and it holds it only as repository secrets that are decoded into the runner's
# working directory for the length of one job:
#
#   COPLANLY_UPLOAD_KEYSTORE_BASE64   the upload keystore, `base64 -w0 coplanly-upload.jks`
#   COPLANLY_RELEASE_STORE_PASSWORD   its store password
#   COPLANLY_RELEASE_KEY_ALIAS        the key alias (the playbook suggests `upload`)
#   COPLANLY_RELEASE_KEY_PASSWORD     the key password
#   GOOGLE_SERVICES_JSON_BASE64       `base64 -w0 app/google-services.json` for the `app.coplanly`
#                                     client — the file is gitignored, and a release build without
#                                     it has no Firebase project to talk to
#
# `app/build.gradle.kts` reads the four `COPLANLY_RELEASE_*` properties from the environment and
# refuses to sign unless all four are present and the store file exists, so a run with a secret
# missing produces an *unsigned* bundle and says so in the summary rather than failing obscurely.
#
# What comes out: the `.aab` and R8's `mapping.txt`, as artifacts. Keep the mapping with every
# upload — without it Crashlytics stack traces from that build are unreadable — and run
# `node tools/check-r8-mapping.js` here as CI does, because a release that renames a Gson field
# ships a child's medical profile as an empty object (audit §2.8).
#
# Not automated on purpose: the `versionCode` bump, the Play upload and the closed-track roll-out
# are decisions, and REL-7 (install the build, confirm a medical profile reaches the co-parent
# non-empty) is a test only a device can run.

name: Release bundle

on:
  workflow_dispatch:
    inputs:
      track_note:
        description: "Free text recorded in the run summary (e.g. 'closed test 3')"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    name: Android — signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decoded into the working directory, which is discarded with the runner. Nothing here is
      # written to a path Gradle caches.
      - name: Restore google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Restore the upload keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.COPLANLY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coplanly-upload.jks"
          echo "COPLANLY_RELEASE_STORE_FILE=$RUNNER_TEMP/coplanly-upload.jks" >> "$GITHUB_ENV"

      - name: Build the release bundle
        env:
          COPLANLY_RELEASE_STORE_PASSWORD: ${{ secrets.COPLANLY_RELEASE_STORE_PASSWORD }}
          COPLANLY_RELEASE_KEY_ALIAS: ${{ secrets.COPLANLY_RELEASE_KEY_ALIAS }}
          COPLANLY_RELEASE_KEY_PASSWORD: ${{ secrets.COPLANLY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify R8 kept the Gson field names
        run: node tools/check-r8-mapping.js

      - name: Say whether the bundle is signed
        run: |
          {
            echo "## Release bundle"
            echo
            if [ -n "${COPLANLY_RELEASE_STORE_FILE:-}" ]; then
              echo "- Signing: **signed with the upload key**"
            else
              echo "- Signing: **UNSIGNED** — one or more of the four COPLANLY_RELEASE_* secrets is missing"
            fi
            echo "- Note: ${{ github.event.inputs.track_note }}"
            echo "- versionName / versionCode: $(grep -E 'versionName|versionCode' app/build.gradle.kts | tr -s ' ' | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: coplanly-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: coplanly-release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 90
