# Continuous integration for CoPlanly.
#
# Written during the August 2026 audit, which found four defects that were invisible for
# exactly one reason: nothing ran the build, the tests or a release build automatically.
# Two of them had already shipped — a release-only Gson corruption of a child's medical
# profile, and a functions test that had been failing on `main`.
#
# Jobs run on every pull request, and on every push to `main`. A push to a feature branch
# with no pull request open is therefore **not** built — open the pull request to get it
# checked. The instrumented job runs on three emulators (API 26, 30 and 35 with 16 KB pages);
# see its comment for what each level is there to catch.
#
# ## Draft pull requests skip the emulator jobs (owner decision, 1 November 2026)
#
# The four emulator jobs — `instrumented`, `e2e`, `upgrade`, `r8-runtime` — are the expensive ones.
# On a **draft** pull request they run only when the pull request carries the `full-ci` label;
# once it is ready for review, or on a push to `main` or a manual run, they run as before. The
# decision is `changes`' `emulators` output (`tools/ci-changes.js --event`, tested in
# `tools/test/ci-changes.test.js`), ANDed into each job's own path gate. The `pull_request` trigger
# lists `labeled` and `ready_for_review` so that adding the label, or marking the pull request
# ready, starts the run that carries them. Every other job is gated as it was.
#
# ## Why the Android work is three jobs and not one
#
# It used to be one job running five Gradle invocations in sequence, and the measured cost
# was 13:22 wall clock: assembleDebug 2:23, unit tests 1:21, lint 2:19, detekt 0:39,
# assembleRelease 6:40. Four of those five have no dependency on each other — only the
# release build genuinely needs its own full compile — so the sequence was pure waiting.
# Split three ways the critical path is the release build alone, ~7 minutes, and the
# repository is public so the extra runners cost nothing.
#
# Two things to know before editing this:
#
#  * **The release build stays on pull requests.** R8 is the only thing that rewrites field
#    names, and an R8 rewrite of a Gson model shipped to devices once already. Moving it to
#    a nightly or to `main`-only would put that class of defect back one merge away from a
#    release. It is the longest job on purpose.
#  * **A skipped job counts as a passing one** for branch protection, which is what makes
#    the `changes` gate below safe today — nothing is a *required* check yet. If any Android
#    job is ever marked required, a docs-only pull request would still merge (skipped reads
#    as success), but make that decision knowingly rather than discovering it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The first three are the defaults, listed because naming any type drops the rest.
    # `labeled` starts a run when `full-ci` is added; `ready_for_review` when a draft is marked
    # ready. A label other than `full-ci` starts a run that does no work: its jobs
    # are skipped (see `changes`).
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  # Manual runs on any branch: a session without an Android SDK can push a branch and have this
  # workflow prove the Kotlin before a pull request exists.
  workflow_dispatch:

concurrency:
  # A `labeled` run for a label other than `full-ci` does no work (its jobs are skipped), so it gets a group of its own
  # (by run id) instead of the pull request's: in the shared group it would cancel the real run
  # in progress and replace it with an empty one. A `full-ci` run, and `ready_for_review`, share
  # the pull request's group on purpose: they supersede a run that skipped the emulators, and a
  # later push supersedes them in turn. Nothing cancels a run in its own group but a newer one.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci')
    && format('-label-{0}', github.run_id) || '' }}
  # Only a pull request's superseded run is cancelled: a run on `main` is the backstop for the legs
  # a pull request skipped, and two quick merges must each get their full matrix.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token's default for a job that names no permissions of its own: read the repository and
# nothing else (security audit, October 2026). A job that needs more says so beside it.
permissions:
  contents: read

jobs:
  # Decides which jobs a pull request needs, from the paths it changes. The rules live in
  # `tools/ci-changes.js`, which `invariants` tests (`tools/test/ci-changes.test.js`), so they can be
  # read and checked without running a workflow. In short, on a pull request:
  #
  #  * docs, Cloud Functions, the rules and their tests → no Android job at all;
  #  * a screen-only change (`presentation/` outside `common/`, `res/`, `app/src/test/`) → no e2e;
  #  * nothing the screenshots render or compare against (`presentation/`, `domain/`, `res/`, the
  #    tests, the baselines in `app/src/test/screenshots/`) → no screenshots;
  #  * the emulator matrix is API 30 alone unless the change touches what API 26 and 16 KB exist for
  #    — `data/local/` (SQLCipher, Room), the manifest, `androidTest/`, `src/debug/` — or the build;
  #  * the shared modules' own jobs run on `shared/**`, `shared-data/**` and `shared-ui/**`, the
  #    build files and this workflow. A change in `shared/` or `shared-data/` counts as the build
  #    does for everything else (the app compiles them); in `shared-ui/`, its strings
  #    (`composeResources/`), screens (`presentation/`) and tests count as the app's `res/`,
  #    `presentation/` and tests they stand for, and the rest of it as the build;
  #  * the iPhone app (`ios-app`) runs whenever the shared jobs do, and on `iosApp/**`, its own
  #    project, which runs no other job.
  #
  # The build files and `.github/workflows/**` run everything: editing this file is exactly when
  # you want to see the build it describes. A push to `main` and a manual run always run everything
  # too — `github.event.before` is unreliable across force-pushes and first pushes, and `main` is
  # where the full matrix, API 26 and 16 KB included, is the backstop for what a PR skipped.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      # The two-parent job also runs on Cloud Functions and rules changes: it is the only job that
      # executes the pairing callable and the rules together, so those are exactly the pull
      # requests that can break it without touching a line of Kotlin.
      e2e: ${{ steps.filter.outputs.e2e }}
      screenshots: ${{ steps.filter.outputs.screenshots }}
      # The upgrade job: the database, the preference store, the schemas, the manifest, the build,
      # its own tests and scripts — or any path tools/ci-changes.js does not know.
      upgrade: ${{ steps.filter.outputs.upgrade }}
      # The `instrumented` job's matrix, as a JSON array of legs.
      matrix: ${{ steps.filter.outputs.matrix }}
      # The `r8-runtime` job: Android changes that can reach the stored JSON, R8's rules or the probe.
      r8runtime: ${{ steps.filter.outputs.r8runtime }}
      # The `web` job: anything but docs and the Android app — web/, web-tests/, functions/,
      # firebase.json, the Firebase CLI's lock file, the workflow, or a path the script does not know.
      web: ${{ steps.filter.outputs.web }}
      # The `shared` and `shared-ios` jobs: the multiplatform modules (`shared/**`, `shared-data/**`,
      # `shared-ui/**`), the build files and the workflow. A path in any of them is also an Android
      # path for every output above (a `shared-ui/` string or screen as the app path it stands for).
      shared: ${{ steps.filter.outputs.shared }}
      # The `ios-app` job: whatever runs the shared jobs, and the iPhone app's own project
      # (`iosApp/**`), which no Android job reads.
      ios: ${{ steps.filter.outputs.ios }}
      # The four emulator jobs (`instrumented`, `e2e`, `upgrade`, `r8-runtime`) may run: false on a
      # draft pull request without the `full-ci` label. ANDed into each of them beside its path
      # gate; true for a ready pull request, a push to `main` and a manual run.
      emulators: ${{ steps.event.outputs.emulators }}
      # A `labeled` run for a label other than `full-ci`: every output is false and `report` stays
      # quiet, so the real run's comment is not overwritten by an empty one.
      unrelated_label: ${{ steps.event.outputs.unrelated_label }}
      # Emulator jobs skipped because the pull request is a draft: the report says so.
      emulators_skipped_on_draft: ${{ steps.event.outputs.emulators_skipped_on_draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the emulator jobs may run
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: node tools/ci-changes.js --event | tee -a "$GITHUB_OUTPUT"

      - name: Decide which jobs to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UNRELATED_LABEL: ${{ steps.event.outputs.unrelated_label }}
        run: |
          set -u
          if [ "$UNRELATED_LABEL" = "true" ]; then
            echo "A label other than full-ci was added — running nothing."
            node tools/ci-changes.js --none | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request — running everything."
            node tools/ci-changes.js --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed=$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null) || [ -z "$changed" ]; then
            echo "Could not determine the changed files — running everything."
            node tools/ci-changes.js --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'
          echo "$changed" | node tools/ci-changes.js | tee -a "$GITHUB_OUTPUT"

  # `google-services.json` is gitignored, and `app/build.gradle.kts` applies the Google
  # Services and Crashlytics plugins only when it is present — so a fresh clone builds
  # without it. The secrets below are read through `project.findProperty(...)`, which falls
  # back to an empty string; nothing here exercises Google sign-in.
  #
  # None of the Gradle steps in this file pass `--no-daemon`. `gradle/actions/setup-gradle`
  # asks you not to: it manages the daemon's lifetime itself, and without one every
  # invocation pays JVM and Kotlin-compiler startup again. The jobs that run two invocations
  # (this one, and static analysis) are the ones that notice.
  build-test:
    name: Android — build & unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `checks: write` is for the JUnit check run at the end; naming any permission drops the
    # rest to none, so `contents: read` has to be restated for the checkout.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # One invocation, not two: `testDebugUnitTest` compiles the same debug sources
      # `assembleDebug` does, so running them together shares a configuration phase and a
      # Kotlin compile instead of repeating both. `testAndroidHostTest` is the three shared
      # modules' JVM tests (AGP 9's Android KMP library target, MON-24 phase 2, Task 13; they ran
      # under the `testDebugUnitTest` selector until then), run here too because Kover merges them
      # into the app's coverage.
      # The current version's schema is deleted before the build, so the check after it can tell
      # "written again, identical" from "not written at all": `git status --porcelain` is clean in
      # both cases, and only the first proves the moved database (MON-24 phase 2) still exports
      # exactly what is committed. `--rerun` on Room's Android processor for the same reason: a
      # KSP task restored from the build cache writes nothing into `app/schemas/`. Only the current
      # version's file is touched; the older ones are fixtures nobody rebuilds.
      - name: Remove the current schema so the build must write it
        run: |
          set -euo pipefail
          version=$(grep -m1 -oE 'version = [0-9]+' shared-data/src/commonMain/kotlin/com/coparently/app/data/local/CoPlanlyDatabase.kt | grep -oE '[0-9]+')
          schema="app/schemas/com.coparently.app.data.local.CoPlanlyDatabase/$version.json"
          echo "Database version $version; removing $schema so the build has to write it again."
          rm -f "$schema"
          echo "SCHEMA_FILE=$schema" >> "$GITHUB_ENV"

      - name: Assemble debug and run unit tests
        run: ./gradlew :app:assembleDebug testDebugUnitTest testAndroidHostTest :shared-data:kspAndroidMain --rerun

      # `DatabaseSchemaExportTest` cannot catch what CQ-1 says it catches, and this is the
      # step that can. KSP (Room) writes `app/schemas/<version>.json` during the build above, from
      # the `room.schemaLocation` argument (in shared-data/build.gradle.kts since MON-24 phase 2,
      # where Room's processor now runs: `:shared-data:kspAndroidMain`, which the app's
      # compile depends on, so this step still follows the task that writes the schema; the
      # moved database must export exactly the committed `46.json`, identity hash included)
      # — so by the time the unit test reads that directory
      # the file it is looking for has just been created, whether or not anybody committed it.
      # The test passes on a repository missing the very export it exists to demand.
      #
      # What is actually wrong in that case is that the build *dirtied a tracked directory*,
      # and git can see that directly. A bumped database version with no schema beside it now
      # fails here, naming the workflow that produces one.
      #
      # `git status --porcelain`, not `git diff`: the case that matters is a *new* version's
      # file, which is untracked, and `git diff` only ever looks at tracked paths — it would
      # have reported clean for exactly the state this exists to catch.
      - name: The exported schema must be committed, not merely producible
        run: |
          set -euo pipefail
          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "::error::Room's Android processor did not write $SCHEMA_FILE: the schema export"
            echo "::error::did not run (room.schemaLocation in shared-data/build.gradle.kts), so"
            echo "::error::nothing here proves the committed schema is still the database's."
            exit 1
          fi
          dirty=$(git status --porcelain -- app/schemas)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error::The build produced a Room schema that is not committed. Run the"
            echo "::error::Regenerate workflow (.github/workflows/regenerate.yml) on this branch"
            echo "::error::by touching .github/regenerate-request, then push its commit."
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-build-test
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # --- Readable results: the steps below feed the check run and the `report` job's PR
      # comment, so a result can be read without opening this log. ---

      # Kover instruments the unit-test task above, so this reuses its run (the test task is
      # up to date) and only writes the reports. Visibility, not a gate: there is no
      # verification rule, and a failure to *report* coverage must not turn a green build red,
      # which is the one place in this file `continue-on-error` is the right tool.
      - name: Coverage report (Kover)
        continue-on-error: true
        run: ./gradlew :app:koverXmlReportUnit :app:koverHtmlReportUnit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 14

      # For testers, one per pull request. **UI-only**: CI has no `google-services.json`, so
      # this APK has no Firebase project — sign-in and sync do not work in it, and the summary
      # comment says so. Uploaded even when a unit test failed: a screen can still be looked at.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coplanly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit-test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish unit-test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Unit tests (JVM)
          report_paths: app/build/test-results/testDebugUnitTest/*.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

  # Lint and detekt were one job, run in sequence: lint 5:15, detekt 0:52 (PR #102). Neither
  # needs the other, so they are two jobs now and a detekt finding is reported without waiting
  # for lint. Lint keeps the `static` id so older links and the report's job list still match.
  static:
    name: Android — lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The three shared modules hold nearly all the code, and their Android target is AGP 9's
      # KMP library, whose main code `lint` alone did not analyse (it ran only their host tests'
      # analysis): NewApi, the per-pull-request guard for minSdk 26, saw none of it. The app's
      # `lint {}` sets checkDependencies, so its report covers their main code too.
      - name: Android lint
        run: ./gradlew lint

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-static
          path: |
            app/build/reports/
            shared/build/reports/
            shared-data/build/reports/
            shared-ui/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  detekt:
    name: Android — detekt
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # detekt **gates** again (CQ-12). It did not for a while: its first run against this
      # repository found 194 weighted issues, essentially all pre-existing — `AddEditEventScreen`
      # at 1,246 lines, `AnalyticsManager` with 22 functions, and every screen added since
      # `config/detekt/baseline.xml` was last generated. Refactoring those to get a first CI run
      # green would have buried the change that introduced CI in an unrelated rewrite, so the
      # step ran with `continue-on-error` instead.
      #
      # The baseline is the mechanism designed for exactly that: it accepts the debt that exists
      # and fails on anything new. Regenerating it needs `./gradlew detektBaseline` and therefore
      # an Android SDK, which the sessions writing this repository do not have — that is what
      # kept it stuck, and what `.github/workflows/regenerate.yml` now solves.
      #
      # **Do not put `continue-on-error` back to get a red build green.** That turns every future
      # violation into a report nobody reads. Either fix the finding or, if it is genuinely
      # accepted debt, regenerate the baseline through the Regenerate workflow so the acceptance
      # is a visible commit.
      #
      # `detekt` is a task selector: it runs `:app:detekt`, `:shared:detekt`, `:shared-data:detekt`
      # and `:shared-ui:detekt`, the shared modules held to the app's configuration and the app's
      # baseline file (one baseline for all four, which `:app:detektBaseline` writes; see
      # shared/build.gradle.kts).
      - name: detekt
        run: ./gradlew detekt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-detekt
          path: |
            app/build/reports/detekt/
            shared/build/reports/detekt/
            shared-data/build/reports/detekt/
            shared-ui/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Android — release build (R8)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # A release build is the only place R8 runs, and R8 is what silently rewrote the field
      # names Gson depended on (the app's own JSON is StoredJson since MON-24, whose keys R8
      # cannot rename, and Google's calendar models left with their client in MON-24 phase 2).
      # It is also where R8 fails on a class a library references and Android lacks (Ktor's
      # `java.lang.management`, `app/proguard-rules.pro`). Building it here is
      # what stops that class of defect from reaching a device again. No signing config exists yet, so this produces an unsigned
      # bundle — which is exactly the part worth checking.
      - name: Assemble release (R8)
        run: ./gradlew :app:assembleRelease

      # The comment above says building here is what stops the reflection/R8 defect reaching a
      # device. Building alone does not: R8 rewriting a kept field raises nothing, emits
      # well-formed JSON, and cannot happen in debug. This reads R8's own mapping and fails when a
      # field a `-keepclassmembers ... { <fields>; }` or `-keep class X { *; }` rule names came
      # out renamed. Since MON-24 phase 2 no rule names one (the app's own models needed them only
      # while Gson wrote them, and the Google Calendar models left with google-http-client), and
      # the check says so and passes; it holds the next reflective reader's rule. It checks the
      # rule worked, which a typo in a package name would otherwise hide.
      - name: Verify R8 kept the reflected field names
        run: node tools/check-r8-mapping.js

      # About fifty Koin bindings answer an interface by asking for its implementation
      # (`single<I> { get<Impl>() }`), which works only while the two are different classes. Should
      # R8 merge an interface into its one implementer, the alias would replace the definition it
      # asks for and the app would overflow the stack at launch, in the minified build alone, which
      # nothing else starts the graph in. This reads R8's mapping and fails when a class of an
      # alias has no entry of its own.
      - name: Verify R8 kept each Koin alias's two classes apart
        run: node tools/check-koin-aliases.js

      # Week 8 of the release audit: the app ships a hand-written baseline profile
      # (app/src/main/baseline-prof.txt). Libraries bring profiles of their own, so this checks
      # that the app's rules merged and that the APK carries the compiled profile.
      - name: Verify the baseline profile reached the release build
        run: tools/check-baseline-profile.sh

      # Play refuses an app whose 64-bit native libraries are not 16 KB-page ready, and the 16 KB
      # emulator leg only loads the few libraries its test touches (see the script).
      - name: Verify native libraries are 16 KB-page aligned
        run: tools/check-16kb-alignment.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-release
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      # Kept separately from the reports: this is the file that turns a future obfuscated
      # Crashlytics stack trace back into source, and the input to the check above.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14

  # REL-7 at runtime. The job above proves R8 ran and that the keep rules held for field *names*;
  # it cannot see the minified app *run*. R8 full mode also strips generic signatures (Gson's
  # TypeToken threw, while the app used Gson), drops constructors, merges and inlines classes — failures that raise
  # nothing at build time and only show when the code executes, which until now meant a person, a
  # phone and docs/DEVICE-CHECKLIST.md §4.1.
  #
  # `assembleR8Test` builds the `r8Test` build type: `release` exactly as R8 shrinks it, plus one
  # kept entry point, a self-targeting instrumentation (app/src/r8Test/), signed with the debug key.
  # tools/run-r8-probe.sh installs it on an API 30 emulator and runs `am instrument`, and the probe
  # — inside the minified process — writes every stored model (StoredJson's, Gson's until MON-24)
  # through the app's own code (the repositories into Room, DayOverrideJson, the event draft, the
  # chat and revision mappers, the calendar's @Key models) and reads it back. tools/check-r8-probe.js fails on any
  # key that is not the source field name, any value that does not read back equal, a probe that
  # did not finish, and a model check-invariants.js finds with no case — each as an ::error::.
  #
  # What it cannot see: Firestore. The probe never signs in, so the documents themselves are the
  # phone's (§4.1), as is a real Google Calendar import. The emulator step follows the other
  # emulator jobs: decided by the status file, the emulator stopped by the script
  # (tools/stop-emulator.sh), `continue-on-error` and a timeout as the backstop, the APK built
  # while the AVD restores (tools/ci-background-build.sh), and the API 30 AVD restored only.
  r8-runtime:
    name: Android — minified build at runtime (R8)
    needs: changes
    if: needs.changes.outputs.r8runtime == 'true' && needs.changes.outputs.emulators == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Two emulator jobs died with "No space left on device" while the SDK manager unpacked the
      # emulator or a system image (2 November 2026); this removes toolchains no job here uses.
      - name: Free disk space
        run: bash tools/ci-free-disk.sh

      # R8 is the long part (~7 minutes in `release`); it runs while the AVD restores and boots.
      - name: Start building the minified APK in the background
        env:
          BACKGROUND_BUILD_TASKS: :app:assembleR8Test
        run: bash tools/ci-background-build.sh start

      # The API 30 AVD the `instrumented` job caches — restored only, so no two jobs race to save it.
      - name: Restore the API 30 AVD
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-default-x86_64-pixel_2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 15 minutes: most of it is waiting for R8; the probe itself takes seconds.
      - name: Run the R8 probe in the minified app
        id: probe
        timeout-minutes: 15
        continue-on-error: true
        env:
          STATUS_FILE: ${{ runner.temp }}/r8-probe-status
          STARTED_FILE: ${{ runner.temp }}/r8-probe-started
          STOP_EMULATOR: 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: touch "$STARTED_FILE"; bash tools/ci-background-build.sh wait && bash tools/run-r8-probe.sh

      # As in the `instrumented` job: a boot that died before the script started is booted again, cold.
      - name: Did the R8 probe start?
        id: probe-started
        if: steps.probe.outcome == 'failure'
        env:
          STARTED_FILE: ${{ runner.temp }}/r8-probe-started
        run: |
          if [ -f "$STARTED_FILE" ]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            # The action kills its emulator when it fails but does not wait for it to exit,
            # and the second boot must not start beside the first.
            bash tools/stop-emulator.sh
          fi

      - name: Run the R8 probe in the minified app (again, on a cold boot)
        id: probe-retry
        if: steps.probe-started.outputs.started == 'false'
        timeout-minutes: 15
        continue-on-error: true
        env:
          STATUS_FILE: ${{ runner.temp }}/r8-probe-status
          STARTED_FILE: ${{ runner.temp }}/r8-probe-started
          STOP_EMULATOR: 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: touch "$STARTED_FILE"; bash tools/ci-background-build.sh wait && bash tools/run-r8-probe.sh

      - name: The probe finished and passed
        if: always()
        env:
          STATUS_FILE: ${{ runner.temp }}/r8-probe-status
          STEP_OUTCOME: ${{ steps.probe-retry.outcome == 'skipped' && steps.probe.outcome || steps.probe-retry.outcome }}
          RETRIED: ${{ steps.probe-retry.outcome != 'skipped' }}
        run: |
          if [ "$RETRIED" = "true" ]; then
            echo "::notice::The emulator died at boot before the script started; this result is from a second, cold boot."
          fi
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::The R8 probe did not finish: the emulator step died or timed out before it wrote an exit status."
            exit 1
          fi
          status=$(cat "$STATUS_FILE")
          if [ "$status" != "0" ]; then
            echo "::error::The R8 probe exited with status $status — see the annotations above, and the r8-probe artefact."
            exit 1
          fi
          if [ "$STEP_OUTCOME" != "success" ]; then
            echo "::warning::The probe passed; the emulator step then failed while shutting the emulator down. That is not a result."
          fi

      - name: Upload the probe's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-probe
          path: |
            app/build/outputs/r8-probe/
            app/build/outputs/mapping/r8Test/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the probe's results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-r8-probe
          path: app/build/outputs/r8-probe/junit/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish the R8 probe check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: R8 runtime probe
          report_paths: app/build/outputs/r8-probe/junit/*.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

  # JVM screenshot tests: Roborazzi on Robolectric's native graphics, no emulator. The images are
  # the way to review light theme, the four translations at 1.5x text and the chosen parent
  # palette without a phone — download the `screenshots` artefact and open `index.html`.
  #
  # **Verify against committed baselines.** The baselines live in `app/src/test/screenshots/` and
  # are recorded only by the Regenerate workflow (regenerate.yml), on this same runner image:
  # Robolectric's native renderer is deterministic per platform and font set, not across them, so
  # a baseline recorded on a laptop would fail here on pixels nobody changed. This job runs
  # `verifyRoborazziDebug` whenever that directory holds an image, and goes red when a screenshot
  # differs from its baseline or has none (a test added without re-running Regenerate). An
  # intended UI change is accepted by running Regenerate on the branch — the new baselines then
  # arrive as a commit, which is the visible "yes, it is meant to look like this".
  #
  # Until the first Regenerate run has committed any baseline it falls back to recording, with a
  # notice, so it still proves every screenshot renders rather than failing on nothing to compare.
  #
  # On a mismatch Roborazzi writes `<variant>_compare.png` (baseline | diff | new) and
  # `<variant>_actual.png` under `app/build/outputs/roborazzi/<component>/` (the per-component
  # folder is `ScreenshotMatrix.optionsFor`'s). They go up as `screenshot-diffs`, the gallery marks
  # those cards "changed", and `screenshot-summary` lets tools/ci-report.js list them in the PR
  # comment.
  #
  # A Roborazzi task runs only the `com.coparently.app.screenshots` tests and `testDebugUnitTest`
  # excludes them (see `roborazziRequested` in app/build.gradle.kts), so this job and
  # `build-test` do not repeat each other's work, and a screenshot that cannot render does not
  # turn the unit-test job red. The first run downloads Robolectric's SDK 34 jar (~100 MB); later
  # runs take it from the Gradle cache `setup-gradle` restores.
  screenshots:
    name: Android — screenshots (Roborazzi)
    needs: changes
    if: needs.changes.outputs.screenshots == 'true'
    # Pinned, like the Regenerate job that records the baselines: Robolectric's renderer is
    # pixel-stable per image and font set, so a moved `ubuntu-latest` would redden every PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # JDK 17 like the other Android jobs. The tests pin Robolectric to SDK 34 because SDK 36
      # needs JDK 21 (`SCREENSHOT_SDK` in ScreenshotMatrix.kt says how to move both).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify or record
        id: mode
        run: |
          if [ -n "$(find app/src/test/screenshots -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "mode=verify" >> "$GITHUB_OUTPUT"
            echo "Baselines found in app/src/test/screenshots: verifying against them."
          else
            echo "mode=record" >> "$GITHUB_OUTPUT"
            echo "::notice title=Screenshots recorded, not compared::No committed baselines in app/src/test/screenshots yet. Run the Regenerate workflow on this branch to record and commit them; until then this job only proves every screenshot renders."
          fi

      - name: Verify screenshots against the committed baselines
        if: steps.mode.outputs.mode == 'verify'
        run: ./gradlew verifyRoborazziDebug

      - name: Record screenshots (no baselines yet)
        if: steps.mode.outputs.mode == 'record'
        run: ./gradlew recordRoborazziDebug

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'

      # One page, filterable by component, status, language, theme, font scale and palette, over
      # the baselines (or, in record mode, what was just recorded) plus any diffs. Staged in its own
      # directory so the committed one never gets an index.html; the artefact is self-contained:
      # unzip, open index.html. `always()` so a failed verify still publishes what it found.
      - name: Build the gallery index
        if: always() && steps.mode.outputs.mode != ''
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          rm -rf app/build/screenshot-gallery app/build/screenshot-summary
          mkdir -p app/build/screenshot-gallery app/build/screenshot-summary
          if [ -d app/src/test/screenshots ]; then cp -R app/src/test/screenshots/. app/build/screenshot-gallery/; fi
          if [ -d app/build/outputs/roborazzi ]; then cp -R app/build/outputs/roborazzi/. app/build/screenshot-gallery/; fi
          node tools/screenshot-gallery.js app/build/screenshot-gallery --mode "$MODE" \
            --summary app/build/screenshot-summary/screenshot-summary.json

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshot-gallery/
          if-no-files-found: warn
          retention-days: 14

      # Only what did not match: small, and what a failure is diagnosed from.
      - name: Upload screenshot diffs
        if: failure() && steps.mode.outputs.mode == 'verify'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/**/*_compare.png
            app/build/outputs/roborazzi/**/*_actual.png
          if-no-files-found: ignore
          retention-days: 14

      # Read by the `report` job; not for people.
      - name: Upload the screenshot summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-summary
          path: app/build/screenshot-summary/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshot-test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-screenshots
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-screenshots
          path: |
            app/build/reports/tests/
            app/build/reports/roborazzi/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # One emulator per API level, in parallel. Three levels because each catches something the
  # others cannot:
  #
  #  * **26 — minSdk.** A call to an API newer than the device (`LocalDate.ofInstant` is 34+; the
  #    CLAUDE.md hard rules name it) compiles against compileSdk 37 and only throws
  #    `NoSuchMethodError` on an old device. Lint's NewApi catches most of it, not all — not a
  #    library that does it for you. 32-bit x86 on purpose: it is a second ABI for SQLCipher's
  #    native library, whose absence is exactly the failure `EncryptedDatabase.fallBackTo` handles.
  #    **Caveat:** mockk only mocks *final* classes on API 28+, and `fakeFirebaseModule` mocks
  #    Firebase types. If one of them is final, the UI tests that load it fail on this leg and only here —
  #    that is a finding about the test module (swap the mock for an open fake), not a reason to
  #    drop the leg.
  #  * **30 — the level this job was built and first made green on.**
  #  * **35 with 16 KB memory pages** (`google_apis_ps16k`). Google Play requires 16 KB page
  #    support for apps targeting Android 15+, and the one native library that decides whether
  #    the app can open its own database is SQLCipher's. A `.so` not aligned for 16 KB pages fails
  #    `System.loadLibrary` on such a device, and `EncryptedDatabaseTest` would say so here rather
  #    than a Play pre-launch report later.
  #
  # `fail-fast: false` so one level's failure does not cancel the others' answers. The AVD is
  # cached per level and arch, following the action's README: on a cache miss one boot creates
  # the AVD and saves a snapshot, and every run after boots from it with `-no-snapshot-save`.
  instrumented:
    name: Android — instrumented tests (API ${{ matrix.api-level }}${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.android == 'true' && needs.changes.outputs.emulators == 'true'
    runs-on: ubuntu-latest
    # The emulator step has its own 10-minute limit; this covers setup, a cold AVD and uploads.
    timeout-minutes: 35
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      # The legs are defined in tools/ci-changes.js (LEG_26, LEG_30, LEG_16KB — the 16 KB leg skips
      # every test marked `@UsesFakeFirebase`, through `notAnnotation=
      # com.coparently.app.testing.UsesFakeFirebase`, because the fake Firebase override mocks
      # through MockK's agent, which does not load on 16 KB pages) and chosen per
      # pull request by the `changes` job: API 30 always, 26 and 16 KB when the diff reaches what
      # they exist for, all three on `main`.
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Two emulator jobs died with "No space left on device" while the SDK manager unpacked the
      # emulator or a system image (2 November 2026); this removes toolchains no job here uses.
      - name: Free disk space
        run: bash tools/ci-free-disk.sh

      # Compiles while the AVD restores and the emulator boots, which used to happen first and
      # leave the build waiting — the script's first line waits for it (tools/ci-background-build.sh).
      - name: Start building the APKs in the background
        run: bash tools/ci-background-build.sh start

      # The runner image ships KVM but leaves it owned by a group the runner user is not in,
      # so without this the emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-pixel_2

      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD snapshot for caching."

      # CQ-1 and SEC-2. What runs here: the migration tests against real SQLite files (only the
      # versions whose schemas exist — see CLAUDE.md for why eight of them are @Ignore'd), the
      # UI tests, which build the whole Koin graph with Room real, and `EncryptedDatabaseTest`,
      # which builds every on-disk state `SqlCipherMigration` names — fresh install, plaintext
      # upgrade, an interrupted export, a lost passphrase — and opens each through the production
      # path. What it cannot prove is an upgrade over data an *older build* wrote, on a phone's
      # hardware-backed Keystore: that stays docs/DEVICE-CHECKLIST.md §2.1.
      #
      # **The leg is decided by the next step, not by this one.** On the API 26 x86 image the
      # emulator twice never exited after `adb emu kill` — 85 of 85 tests had passed, and the job
      # sat until its 60-minute timeout. A detached `pkill` of the qemu process did not release
      # it either. So this step has its own timeout and `continue-on-error`, the script writes
      # the tests' exit status to a file, and "The instrumented tests finished and passed" fails
      # the job unless that file exists and says 0. A test failure, or a hang before the tests
      # finish, is still red; a hang after they passed costs the step's timeout and a warning.
      #
      # The hang was not a one-off: on PR #102 both API 26 and API 30 passed every test and then
      # sat 9–11 minutes in the action's shutdown, which made them the whole run's critical path.
      # So the script now stops the emulator itself, synchronously, once the status is written
      # (STOP_EMULATOR, tools/stop-emulator.sh), and the timeout below is only the backstop.
      #
      # 15 minutes: the step measured ~6 on API 26 with the build inside it (boot ~1, build ~3,
      # tests ~2), and the build now runs in the background before it — but the step still waits
      # for that build. On PR #127, which changed both the app and androidTest, the wait took ~8
      # minutes, and the API 30 leg passed all 155 tests and was stopped two seconds later at the
      # old 10-minute limit. When the tests outgrow it, the next step says so in plain words —
      # "did not finish" — and the answer is to raise this number, not to split the suite.
      - name: Run instrumented tests
        id: tests
        timeout-minutes: 15
        continue-on-error: true
        env:
          STATUS_FILE: ${{ runner.temp }}/instrumented-status
          STARTED_FILE: ${{ runner.temp }}/instrumented-started
          STOP_EMULATOR: 'true'
          # Only the legs whose emulator survives screenrecord record (tools/ci-changes.js).
          RECORD_SCREEN: ${{ matrix.record }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Waits for the background build, then records the screen in 170 s segments while the
          # tests run (on legs with `record`) and pulls the MP4s after; the exit status is the
          # tests', and a recorder that fails never fails the job.
          script: touch "$STARTED_FILE"; bash tools/ci-background-build.sh wait && bash tools/clear-system-dialogs.sh && bash tools/with-screen-recording.sh ./gradlew :app:connectedDebugAndroidTest ${{ matrix.test-args }}

      # **A boot that dies before the script starts is booted again, once, cold.** The cached API 30
      # snapshot sometimes comes up without its input service: `sys.boot_completed` reads 1 at once,
      # the action's own unlock (`adb shell input keyevent 82`) fails with "No service published for:
      # input", and the script never runs (PR #130: runs 366, 369 and 373, in four jobs). The script's
      # first command touches $STARTED_FILE, so "never started" is a fact on disk; when the step
      # failed without it, the next step boots the same AVD again with `-no-snapshot`, where
      # boot_completed waits for every service. A test that started and then failed or hung is a
      # result, and is never retried. The check step after reads whichever attempt ran last and
      # says when it was the second.
      - name: Did the instrumented tests start?
        id: tests-started
        if: steps.tests.outcome == 'failure'
        env:
          STARTED_FILE: ${{ runner.temp }}/instrumented-started
        run: |
          if [ -f "$STARTED_FILE" ]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            # The action kills its emulator when it fails but does not wait for it to exit,
            # and the second boot must not start beside the first.
            bash tools/stop-emulator.sh
          fi

      - name: Run instrumented tests (again, on a cold boot)
        id: tests-retry
        if: steps.tests-started.outputs.started == 'false'
        timeout-minutes: 15
        continue-on-error: true
        env:
          STATUS_FILE: ${{ runner.temp }}/instrumented-status
          STARTED_FILE: ${{ runner.temp }}/instrumented-started
          STOP_EMULATOR: 'true'
          RECORD_SCREEN: ${{ matrix.record }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: touch "$STARTED_FILE"; bash tools/ci-background-build.sh wait && bash tools/clear-system-dialogs.sh && bash tools/with-screen-recording.sh ./gradlew :app:connectedDebugAndroidTest ${{ matrix.test-args }}

      - name: The instrumented tests finished and passed
        if: always()
        env:
          STATUS_FILE: ${{ runner.temp }}/instrumented-status
          STEP_OUTCOME: ${{ steps.tests-retry.outcome == 'skipped' && steps.tests.outcome || steps.tests-retry.outcome }}
          RETRIED: ${{ steps.tests-retry.outcome != 'skipped' }}
        run: |
          if [ "$RETRIED" = "true" ]; then
            echo "::notice::The emulator died at boot before the script started; this result is from a second, cold boot."
          fi
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::The instrumented tests did not finish: the emulator step died or timed out before they wrote an exit status."
            exit 1
          fi
          status=$(cat "$STATUS_FILE")
          if [ "$status" != "0" ]; then
            echo "::error::connectedDebugAndroidTest exited with status $status."
            exit 1
          fi
          if [ "$STEP_OUTCOME" != "success" ]; then
            echo "::warning::The tests passed; the emulator step then failed while shutting the emulator down. That is not a test result."
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-instrumented-api${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-video-api${{ matrix.api-level }}-${{ matrix.target }}
          path: app/build/outputs/emulator-video/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload instrumented-test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-instrumented-api${{ matrix.api-level }}-${{ matrix.target }}
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish instrumented-test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Instrumented tests (API ${{ matrix.api-level }}${{ matrix.label }})
          report_paths: app/build/outputs/androidTest-results/connected/**/*.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

  # Two parents, one process, the real backend's emulators (CQ-18 and the two-phone checklist, as
  # far as a runner can take them). `app/src/androidTest/.../e2e` signs up two accounts on the
  # Auth emulator, pairs them through the real `acceptPairingInvitation` on the Functions
  # emulator, and drives the production repositories — events, a private event and a tombstone,
  # chat across the date line, a shared expense, a second family, a chat attachment and a vault
  # document — against the real `firestore.rules` and `storage.rules` on the Firestore and Storage
  # emulators. Each parent is a named FirebaseApp with its own
  # Room database; see `EmulatorParent`.
  #
  # Things that must stay true, each learned from something that did not:
  #  * **No `google-services.json`, fake or otherwise.** The tests configure their FirebaseApps
  #    from `FirebaseOptions` for the `demo-coplanly` project, which needs no credentials and
  #    cannot reach production. The plugin gate in `app/build.gradle.kts` stays closed.
  #  * **The `instrumented` job above is untouched.** These tests start no Koin graph and install
  #    no override; without the `coplanlyEmulatorHost` argument they skip themselves, so that job
  #    reports them as skipped and keeps `fakeFirebaseModule`'s mocks for everything else.
  #  * **A skip is a failure here.** The last step reads the XML and fails on any skipped test,
  #    so a missing argument cannot turn this job green by running nothing.
  #  * **Two JDKs.** The emulators need 21+ on PATH (firestore-tests/README.md); Gradle builds on
  #    17 through JAVA_HOME. JDK 21 is set up first and its path handed to the script, so the
  #    second setup-java leaves JAVA_HOME and PATH on 17 for Gradle.
  #  * **Host loopback, not 0.0.0.0.** The Android emulator reaches the runner's 127.0.0.1 as
  #    `10.0.2.2`, so `firebase.json`'s default binding is already reachable. Cleartext to that
  #    address is allowed in `app/src/debug/res/xml/network_security_config.xml` — debug only.
  e2e:
    name: Android — two parents on the Firebase emulators
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.emulators == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Firebase emulators)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up JDK 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firestore-tests/package-lock.json

      # `functions/` is what the Functions emulator loads; `firestore-tests/` pins the Firebase
      # CLI version the rules suite already runs on, so both jobs use one emulator build.
      - name: Install the Cloud Functions and the Firebase CLI
        run: |
          npm ci --prefix functions
          npm ci --prefix firestore-tests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Two emulator jobs died with "No space left on device" while the SDK manager unpacked the
      # emulator or a system image (2 November 2026); this removes toolchains no job here uses.
      - name: Free disk space
        run: bash tools/ci-free-disk.sh

      # Built while the AVD restores and the emulator boots; the script's first line waits for it
      # (tools/ci-background-build.sh). It used to run first, and the boot waited behind it.
      - name: Start building the APKs in the background
        run: bash tools/ci-background-build.sh start

      # The Firestore and Storage emulators are jars the CLI downloads on first use (~20 s a run).
      # Keyed on the lock file that pins the CLI, so a CLI upgrade fetches the matching jars.
      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      # The API 30 AVD the `instrumented` job caches, snapshot included — restored only, so the
      # two jobs never race to save it. On a miss the action creates the AVD as it always did.
      - name: Restore the API 30 AVD
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-default-x86_64-pixel_2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Decided by the status file, not by this step, for the reason the `instrumented` job's
      # emulator step is: on PR #103 every test had finished at 09:27 and the action's own
      # shutdown then held the job until its 50-minute limit. The script stops the emulator
      # itself (tools/stop-emulator.sh); the timeout is the backstop.
      - name: Run the two-parent tests
        id: e2e-tests
        timeout-minutes: 20
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FIREBASE_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
          STATUS_FILE: ${{ runner.temp }}/e2e-status
          STARTED_FILE: ${{ runner.temp }}/e2e-started
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Stops the emulator itself once the tests are done (tools/stop-emulator.sh), since a
          # snapshot boot is what the `instrumented` job's shutdown hang was seen on.
          script: touch "$STARTED_FILE"; adb logcat -G 16M || true; bash tools/ci-background-build.sh wait && bash tools/e2e/run-two-parent-tests.sh; status=$?; echo "$status" > "$STATUS_FILE"; mkdir -p app/build/outputs && adb logcat -d -v time > app/build/outputs/e2e-logcat.txt 2>&1; echo "::group::logcat — E2E steps (timed), failures, crashes"; grep -E "I/E2E|E/E2E.*FAILED|AndroidRuntime|[WE]/(ChatViewModel|MessageRepo|ChatMirror)" app/build/outputs/e2e-logcat.txt | tail -n 400; echo "::endgroup::"; echo "::group::logcat — thread dumps of failed tests"; grep -E "E/E2E" app/build/outputs/e2e-logcat.txt | tail -n 800; echo "::endgroup::"; bash tools/stop-emulator.sh; exit $status

      # As in the `instrumented` job: a boot that died before the script started is booted again, cold.
      - name: Did the two-parent tests start?
        id: e2e-tests-started
        if: steps.e2e-tests.outcome == 'failure'
        env:
          STARTED_FILE: ${{ runner.temp }}/e2e-started
        run: |
          if [ -f "$STARTED_FILE" ]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            # The action kills its emulator when it fails but does not wait for it to exit,
            # and the second boot must not start beside the first.
            bash tools/stop-emulator.sh
          fi

      - name: Run the two-parent tests (again, on a cold boot)
        id: e2e-tests-retry
        if: steps.e2e-tests-started.outputs.started == 'false'
        timeout-minutes: 20
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FIREBASE_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
          STATUS_FILE: ${{ runner.temp }}/e2e-status
          STARTED_FILE: ${{ runner.temp }}/e2e-started
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: touch "$STARTED_FILE"; adb logcat -G 16M || true; bash tools/ci-background-build.sh wait && bash tools/e2e/run-two-parent-tests.sh; status=$?; echo "$status" > "$STATUS_FILE"; mkdir -p app/build/outputs && adb logcat -d -v time > app/build/outputs/e2e-logcat.txt 2>&1; echo "::group::logcat — E2E steps (timed), failures, crashes"; grep -E "I/E2E|E/E2E.*FAILED|AndroidRuntime|[WE]/(ChatViewModel|MessageRepo|ChatMirror)" app/build/outputs/e2e-logcat.txt | tail -n 400; echo "::endgroup::"; echo "::group::logcat — thread dumps of failed tests"; grep -E "E/E2E" app/build/outputs/e2e-logcat.txt | tail -n 800; echo "::endgroup::"; bash tools/stop-emulator.sh; exit $status

      - name: The two-parent tests finished and passed
        if: always()
        env:
          STATUS_FILE: ${{ runner.temp }}/e2e-status
          STEP_OUTCOME: ${{ steps.e2e-tests-retry.outcome == 'skipped' && steps.e2e-tests.outcome || steps.e2e-tests-retry.outcome }}
          RETRIED: ${{ steps.e2e-tests-retry.outcome != 'skipped' }}
        run: |
          if [ "$RETRIED" = "true" ]; then
            echo "::notice::The emulator died at boot before the script started; this result is from a second, cold boot."
          fi
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::The two-parent tests did not finish: the emulator step died or timed out before they wrote an exit status."
            exit 1
          fi
          status=$(cat "$STATUS_FILE")
          if [ "$status" != "0" ]; then
            echo "::error::The two-parent tests exited with status $status."
            exit 1
          fi
          if [ "$STEP_OUTCOME" != "success" ]; then
            echo "::warning::The tests passed; the emulator step then failed while shutting the emulator down. That is not a test result."
          fi

      - name: Every two-parent test ran — none skipped
        if: always()
        run: |
          set -euo pipefail
          # The runner names its file "TEST-emulator-5554 - 11-_app-.xml": spaces, so never
          # word-split a list of paths — grep the directory recursively instead.
          dir=app/build/outputs/androidTest-results
          if [ -z "$(find "$dir" -name '*.xml' 2>/dev/null || true)" ]; then
            echo "::error::No instrumentation results were written."
            exit 1
          fi
          if ! grep -rq --include='*.xml' 'classname="com.coparently.app.e2e.' "$dir"; then
            echo "::error::No test in com.coparently.app.e2e ran."
            exit 1
          fi
          if grep -rq --include='*.xml' '<skipped' "$dir"; then
            echo "::error::A two-parent test was skipped — the emulator host argument did not arrive."
            exit 1
          fi

      - name: Upload two-parent test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish two-parent test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Two-parent tests (e2e)
          report_paths: app/build/outputs/androidTest-results/connected/**/*.xml
          detailed_summary: true
          require_tests: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-e2e
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/e2e-logcat.txt
            firebase-debug.log
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 14

  # "Install the new build over the previous one" (docs/DEVICE-CHECKLIST.md §2.1), on an emulator.
  # `EncryptedDatabaseTest` builds every on-disk state the *current* code names; nothing else opens
  # data an *older build* wrote. This job does: it builds the base build — the pull request's base
  # commit, or on `main` the commit before the push — installs it, lets it write a family's state
  # through its own code (`UpgradeSeedTest`: rows in eight tables through the production SQLCipher
  # open path, the sealed SEC-5 preference store with a refresh token and the telemetry answer),
  # installs this build over it with `adb install -r`, and checks from inside this build
  # (`UpgradeVerifyTest`) that the database opens with the *recovered* passphrase, every Room
  # migration ran to the newest exported schema, nothing was lost, the file is still ciphertext and
  # the consent question stays answered. `tools/upgrade/run-upgrade-test.sh` is the orchestration.
  #
  # Things that must stay true:
  #  * **Both builds in this one job**, under one HOME, so AGP signs both with the same
  #    ~/.android/debug.keystore — `adb install -r` refuses an update signed by another key, and
  #    an instrumentation must share its target's certificate. The script compares the three APKs'
  #    certificates with apksigner before installing anything, rather than assuming it.
  #  * **The seed runs on the base build's classes** (the test APK is this branch's, the app
  #    process is the base's), so it touches only the handful of signatures `UpgradeFixture`
  #    lists and writes rows by SQL. A pull request that changes one of those fails the seed with
  #    `NoSuchMethodError`; the fix is in the fixture, as its KDoc says.
  #  * **A skip is a failure.** Both classes skip themselves without `-e coplanlyUpgradePhase`,
  #    which is what keeps them out of the `instrumented` job, and `am instrument` prints
  #    "OK (1 test)" for a skip — so `tools/upgrade/instrument-results.js` decides from the
  #    per-test status codes, and a skip, a crash or no test at all is red.
  #  * **Decided by the status file**, like the other emulator jobs: the script stops the emulator
  #    itself (tools/stop-emulator.sh), and the step's timeout and `continue-on-error` are only the
  #    backstop for the action's shutdown hang.
  #
  # What it cannot prove: an upgrade from a build older than the base (a phone that skipped
  # releases runs a longer migration chain than this one — `CoPlanlyDatabaseMigrationTest` is the
  # place for that), the plaintext → encrypted conversion of SEC-2 (the base already ships
  # SQLCipher, so this is encrypted → encrypted; the verify still passes, and says so, if a base
  # ever wrote plaintext), and a real phone's hardware-backed Keystore.
  upgrade:
    name: Android — upgrade over main
    needs: changes
    if: needs.changes.outputs.upgrade == 'true' && needs.changes.outputs.emulators == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD~1 is the fallback base when the event names none (a manual run, a first push).
          fetch-depth: 2

      - name: Choose the base build
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) sha="$PR_BASE_SHA" ;;
            push) sha="$PUSH_BEFORE" ;;
            *) sha="" ;;
          esac
          # A new branch's first push reports forty zeros as `before`.
          if [ -z "$sha" ] || [ -z "${sha//0/}" ]; then
            sha=$(git rev-parse HEAD~1)
            echo "::notice::No base commit in the event; upgrading over the parent commit $sha."
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Base build: $sha ($EVENT_NAME)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check out the base build
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: upgrade-base
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Lets setup-gradle save and restore Gradle's configuration cache between runs (it holds
          # secrets, so it is only stored encrypted). Optional: with the repository secret unset
          # the cache still works within one job, just not across runs.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # In the foreground and first: it is the build that creates ~/.android/debug.keystore if the
      # runner has none, and the branch's build below must find that same file, not race to make
      # its own. Its own wrapper and Gradle version — it is the base commit's build, exactly.
      - name: Build the base build (app APK)
        working-directory: upgrade-base
        # The base build's daemon would otherwise keep its 4 GB heap beside this branch's
        # daemon and the emulator on a 16 GB runner.
        run: ./gradlew :app:assembleDebug && ./gradlew --stop

      # "A co-parent on the previous build", for the Firestore wire format (CLAUDE.md, the rule
      # under item 5). This branch's `app/src/test/resources/wire/current/` is what it writes; the
      # base build's *own* `WireContractTest` reads it — parses it, reads what the writer read, and
      # writes it back losing only what the writer declared droppable. Skipped with a notice when the
      # base has no such test (the first PRs after it lands) and when `wire/current` is unchanged
      # (the base's own CI read those documents already), so it costs the base's unit-test compile
      # only on a wire-format change. Before the background build, so the two daemons never overlap;
      # `continue-on-error` so the install-over check below still runs, and the last step fails the
      # job on its outcome.
      - name: The base build reads what this branch writes (wire contracts)
        id: wire
        continue-on-error: true
        working-directory: upgrade-base
        run: |
          set -euo pipefail
          current="$GITHUB_WORKSPACE/app/src/test/resources/wire/current"
          # The harness lives in `:shared-data`'s commonTest from MON-24 phase 2 (Task 8a), which
          # the base's app unit tests compile and run with every contract; before that, in the app.
          if [ ! -f app/src/test/java/com/coparently/app/wire/WireContractTest.kt ] \
            && [ ! -f shared-data/src/commonTest/kotlin/com/coparently/app/wire/WireContractTest.kt ]; then
            echo "::notice::The base build predates WireContractTest; the previous-build wire check starts once the base has it."
            exit 0
          fi
          if [ ! -d "$current" ]; then
            echo "::error::This branch has no app/src/test/resources/wire/current/ for the base build to read."
            exit 1
          fi
          if diff -rq app/src/test/resources/wire/current "$current" > /dev/null 2>&1; then
            echo "::notice::wire/current is unchanged from the base build; nothing new for it to read."
            exit 0
          fi
          rm -rf app/src/test/resources/wire/current
          cp -R "$current" app/src/test/resources/wire/current
          status=0
          # `:app:` because a base that has the `:shared` module would otherwise also run its
          # unit tests under this filter, find none, and fail with "No tests found".
          ./gradlew :app:testDebugUnitTest --tests '*WireContractTest*' || status=$?
          ./gradlew --stop
          if [ "$status" != "0" ]; then
            echo "::error::The base build cannot read, or would lose, what this branch writes. See the failures above and CLAUDE.md's wire-format rule: declare a key older builds may drop in CurrentWrite.olderBuildsMayDrop, or keep the old shape readable."
          fi
          exit $status

      # Two emulator jobs died with "No space left on device" while the SDK manager unpacked the
      # emulator or a system image (2 November 2026); this removes toolchains no job here uses.
      - name: Free disk space
        run: bash tools/ci-free-disk.sh

      # This branch's app and test APKs, while the AVD restores and the emulator boots; the
      # emulator script's first line waits for it (tools/ci-background-build.sh).
      - name: Start building this branch's APKs in the background
        run: bash tools/ci-background-build.sh start

      # The API 30 AVD the `instrumented` job caches, snapshot included — restored only, so the
      # jobs never race to save it. On a miss the action creates the AVD as it always did.
      - name: Restore the API 30 AVD
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-default-x86_64-pixel_2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 15 minutes: the wait for this branch's build (~3–5), the boot, two installs, two short
      # instrumentation runs. Decided by the status file, not by this step (see above).
      - name: Install the base build, seed it, upgrade, verify
        id: upgrade-run
        timeout-minutes: 15
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STATUS_FILE: ${{ runner.temp }}/upgrade-status
          STARTED_FILE: ${{ runner.temp }}/upgrade-started
          BASE_APK: upgrade-base/app/build/outputs/apk/debug/app-debug.apk
          RESULTS_DIR: app/build/outputs/upgrade-results
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: touch "$STARTED_FILE"; adb logcat -G 16M || true; bash tools/ci-background-build.sh wait && bash tools/upgrade/run-upgrade-test.sh; status=$?; echo "$status" > "$STATUS_FILE"; bash tools/stop-emulator.sh; exit $status

      # As in the `instrumented` job: a boot that died before the script started is booted again, cold.
      - name: Did the upgrade check start?
        id: upgrade-run-started
        if: steps.upgrade-run.outcome == 'failure'
        env:
          STARTED_FILE: ${{ runner.temp }}/upgrade-started
        run: |
          if [ -f "$STARTED_FILE" ]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            # The action kills its emulator when it fails but does not wait for it to exit,
            # and the second boot must not start beside the first.
            bash tools/stop-emulator.sh
          fi

      - name: Install the base build, seed it, upgrade, verify (again, on a cold boot)
        id: upgrade-run-retry
        if: steps.upgrade-run-started.outputs.started == 'false'
        timeout-minutes: 15
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STATUS_FILE: ${{ runner.temp }}/upgrade-status
          STARTED_FILE: ${{ runner.temp }}/upgrade-started
          BASE_APK: upgrade-base/app/build/outputs/apk/debug/app-debug.apk
          RESULTS_DIR: app/build/outputs/upgrade-results
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: touch "$STARTED_FILE"; adb logcat -G 16M || true; bash tools/ci-background-build.sh wait && bash tools/upgrade/run-upgrade-test.sh; status=$?; echo "$status" > "$STATUS_FILE"; bash tools/stop-emulator.sh; exit $status

      - name: The upgrade finished and passed
        if: always()
        env:
          STATUS_FILE: ${{ runner.temp }}/upgrade-status
          STEP_OUTCOME: ${{ steps.upgrade-run-retry.outcome == 'skipped' && steps.upgrade-run.outcome || steps.upgrade-run-retry.outcome }}
          RETRIED: ${{ steps.upgrade-run-retry.outcome != 'skipped' }}
        run: |
          if [ "$RETRIED" = "true" ]; then
            echo "::notice::The emulator died at boot before the script started; this result is from a second, cold boot."
          fi
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::The upgrade check did not finish: the emulator step died or timed out before it wrote an exit status."
            exit 1
          fi
          status=$(cat "$STATUS_FILE")
          if [ "$status" != "0" ]; then
            echo "::error::The upgrade check exited with status $status."
            exit 1
          fi
          if [ "$STEP_OUTCOME" != "success" ]; then
            echo "::warning::The upgrade check passed; the emulator step then failed while shutting the emulator down. That is not a test result."
          fi

      - name: The base build read this branch's wire documents
        if: always() && steps.wire.outcome == 'failure'
        run: |
          echo "::error::The wire-contract step failed: the previous build cannot read what this branch writes (see that step's log and the android-reports-upgrade artefact)."
          exit 1

      - name: Upload upgrade results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-upgrade
          path: app/build/outputs/upgrade-results/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish upgrade check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Upgrade over the base build
          report_paths: app/build/outputs/upgrade-results/TEST-*.xml
          detailed_summary: true
          require_tests: true

      # The raw `am instrument` output and the logcat of each phase.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-upgrade
          path: |
            app/build/outputs/upgrade-results/
            upgrade-base/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  invariants:
    name: Resource and payload invariants
    # Skipped on the run a label other than `full-ci` starts (see `changes`): no `needs: changes`, so
    # they are gated on the event itself.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`: the script has no dependencies, deliberately. It reads XML and Kotlin as
      # text, so it needs neither an Android SDK nor a parser, which is what lets it run here
      # in seconds rather than behind the Android gate.
      #
      # It is not redundant with `static`. `MissingTranslation` is *disabled* in
      # app/build.gradle.kts rather than demoted, and a disabled check reports nothing under
      # any severity — so an untranslated key reaches a reader's device as English and no job
      # in this file notices. The push-type half is not something lint could check at all: it
      # spans PushPayload.kt, firestore.rules, PushNotifier.kt and push_strings.xml,
      # and a type missing from any one of them is a notification that never appears (SEC-3).
      - name: Check locale completeness, format arguments and push types
        run: node tools/check-invariants.js

      # Every feature two phones share — a Firestore collection in firestore.rules, a Storage
      # prefix in storage.rules, a push type in PushPayload.kt, a callable or HTTPS function in
      # functions/ — names the two-parent e2e test that covers it in tools/e2e/coverage.json, or
      # says why none can. A new one fails here until it does, which is the point: a feature
      # between two phones arrives with its emulator test rather than with a tester's afternoon.
      - name: Every shared feature has a two-parent test
        if: always()
        run: node tools/check-e2e-coverage.js

      # The CI report's own scripts: the path → DEVICE-CHECKLIST.md mapping (including that
      # every section it names still exists) and the JUnit/coverage parsing. node:test, no deps.
      - name: Test the CI report tools
        if: always()
        run: node --test tools/test/*.test.js

  functions:
    name: Cloud Functions
    # Skipped on the run a label other than `full-ci` starts (see `changes`): no `needs: changes`, so
    # they are gated on the event itself.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      # `npm test` plus a reporter that writes JUnit XML beside mocha's usual spec output
      # (tools/mocha-ci-reporter.js, no dependency). Locally `npm test` is unchanged.
      - name: npm test
        env:
          MOCHA_JUNIT_OUTPUT: ${{ runner.temp }}/junit/functions.xml
        run: npm test -- --reporter ../tools/mocha-ci-reporter.js
      - name: Lint
        if: always()
        run: npm run lint

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-functions
          path: ${{ runner.temp }}/junit/functions.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Cloud Functions tests
          report_paths: ${{ runner.temp }}/junit/functions.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

  # `web/verify/` in a real browser, and the calendar feed as a calendar app reads it (web-tests/,
  # September 2026). Playwright drives Chromium against the page served from a loopback address and
  # pointed at the Functions emulator (the page's `?functions=` hook is honoured only there): receipts
  # are reserved and registered through the real callables as an Auth-emulator account, then the page
  # is asked about the exported file, a one-byte-tampered copy, the record ID, an unknown ID, in both
  # of its languages and at 375 px — and must never show a uid, a family id or a name. The feed half
  # parses every `.ics` — `buildFeed` in all five languages, and the real `calendarFeed` endpoint
  # behind a link `createCalendarFeed` minted — with Mozilla's ical.js plus an octet-level RFC 5545
  # check (CRLF, 75-octet folding outside UTF-8 sequences, TEXT escaping, required properties).
  #
  # The emulators are started the way the e2e job starts them (web-tests/run-with-emulators.sh:
  # `firebase emulators:exec` from firestore-tests/' pinned CLI, JDK 21 through FIREBASE_JAVA_HOME),
  # without an Android emulator, so this job takes minutes. COPLANLY_REQUIRE_EMULATORS makes an
  # emulator test that would skip fail instead, so the job cannot turn green by running nothing.
  web:
    name: Web — verification page and calendar feed
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Pinned (9 November 2026): `ubuntu-latest` became 26.04, where Playwright 1.56.1 refuses
    # `install --with-deps chromium` ("does not support chromium on ubuntu26.04-x64"), so the job
    # failed before a test ran. Move it with a Playwright release that supports the newer image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Firebase emulators)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firestore-tests/package-lock.json
            web-tests/package-lock.json

      # `functions/` is what the Functions emulator loads, `firestore-tests/` pins the Firebase CLI
      # (one emulator build for the rules, e2e and web jobs), `web-tests/` is Playwright and ical.js.
      - name: Install the Cloud Functions, the Firebase CLI and the web tests
        run: |
          npm ci --prefix functions
          npm ci --prefix firestore-tests
          npm ci --prefix web-tests

      # Browsers are keyed on the lock file that pins Playwright, whose version names the build.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web-tests/package-lock.json') }}

      - name: Install Chromium for Playwright
        working-directory: web-tests
        run: npx playwright install --with-deps chromium

      # Restore only: the `rules` job saves this key, and two jobs saving it would race.
      - name: Restore the Firebase emulators
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      - name: Verification page and calendar feed on the emulators
        env:
          FIREBASE_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
          COPLANLY_REQUIRE_EMULATORS: '1'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ runner.temp }}/junit/web.xml
        run: bash web-tests/run-with-emulators.sh

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-web
          path: ${{ runner.temp }}/junit/web.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Web — verify page and ICS
          report_paths: ${{ runner.temp }}/junit/web.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

      # Playwright keeps a trace (DOM snapshots, network, console) of each failed test: open it
      # with `npx playwright show-trace <zip>` or at trace.playwright.dev.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-traces
          path: web-tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

  rules:
    name: Firestore security rules
    # Skipped on the run a label other than `full-ci` starts (see `changes`): no `needs: changes`, so
    # they are gated on the event itself.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      # The Firestore emulator is a Java process, and it needs a JDK on PATH — not merely in
      # JAVA_HOME. See firestore-tests/README.md.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      - run: npm ci
      # `test:ci` is `test` with tools/mocha-ci-reporter.js added, which also writes JUnit XML.
      - name: npm test
        env:
          MOCHA_JUNIT_OUTPUT: ${{ runner.temp }}/junit/rules.xml
        run: npm run test:ci
      - name: Lint
        if: always()
        run: npm run lint

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-rules
          path: ${{ runner.temp }}/junit/rules.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Firestore and Storage rules tests
          report_paths: ${{ runner.temp }}/junit/rules.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

  # The shared Kotlin Multiplatform modules (MON-24): `shared/`, the domain the Android app and the
  # iPhone app both run, `shared-data/`, the data layer (phase 2), and `shared-ui/`, the UI (from
  # phase 2's Task 9: the strings as Compose Multiplatform resources, the theme and the common
  # components). Two jobs, gated on `changes`' `shared` output (`shared/**`, `shared-data/**`,
  # `shared-ui/**`, the build files, the workflow). `build-test` runs these tests too, because Kover
  # merges `:shared`, `:shared-data` and `:shared-ui` into the app's coverage; this job is where they
  # get a check run of their own, beside the iOS compile. Each module's JVM tests are its
  # `androidHostTest` source set with commonTest, run by `testAndroidHostTest` (AGP 9's Android KMP
  # library target since Task 13; `androidUnitTest` and `testDebugUnitTest` before). `:shared-ui`'s
  # own tests are the theme's (slice 9b) and the moved ViewModels' and shared state's (Task 10:
  # commonTest and `androidHostTest`), run on the JVM; its strings are checked by the app's parity
  # tests (`StringsParityTest`, `PluralsParityTest`, in `build-test`), and its iOS klib — `Res`, the
  # theme, the common components and the ViewModels — and its commonTest are compiled here for iOS.
  # Nothing runs `:shared-ui`'s commonTest on the simulator yet: its test executable would link
  # `shared-data`'s Firebase pods, which only `shared-data` (CocoaPods, `linkOnly`) provides.
  #
  # `compileKotlinIosSimulatorArm64` builds the iOS klib on Linux. Kotlin has done that without a
  # flag since 2.2.20 ("stable cross-platform compilation"), so a common-code change that does not
  # compile for iOS — a `java.*` import in commonMain, say — fails here on every pull request,
  # whether or not the Mac is online. `compileTestKotlinIosSimulatorArm64` does the same for
  # commonTest: Kotlin/Native refuses names the JVM accepts (a comma or parentheses in a backticked
  # test name), and the JVM run above never sees it. Linking the framework and running the tests
  # on a simulator need Xcode: that is `shared-ios` below.
  shared:
    name: Shared — JVM tests and iOS compile
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The Kotlin/Native compiler and its dependencies (a few hundred MB), keyed on the root
      # build file, which names the Kotlin version.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      # Room's processor for the iPhone writes the exported schema into `app/schemas/` too (the
      # database is common code since MON-24 phase 2). The current version's file is deleted first
      # and the iOS processor runs on its own, before anything Android's processor would also write
      # it, so the check below proves this processor wrote it, identical, rather than finding it
      # untouched. `--rerun`: a KSP task restored from the build cache writes nothing there.
      - name: Remove the current schema so the iPhone build must write it
        run: |
          set -euo pipefail
          version=$(grep -m1 -oE 'version = [0-9]+' shared-data/src/commonMain/kotlin/com/coparently/app/data/local/CoPlanlyDatabase.kt | grep -oE '[0-9]+')
          schema="app/schemas/com.coparently.app.data.local.CoPlanlyDatabase/$version.json"
          echo "Database version $version; removing $schema so the build has to write it again."
          rm -f "$schema"
          echo "SCHEMA_FILE=$schema" >> "$GITHUB_ENV"

      - name: Room's processor for iOS
        run: ./gradlew :shared-data:kspKotlinIosSimulatorArm64 --rerun

      # The same check as `build-test`'s, for the iPhone's processor: the schema it exports must be
      # the committed one, byte for byte. The schema is common code, so a difference here is a
      # difference between Room's targets, which no migration could reconcile.
      - name: The iPhone build exports the committed Room schema
        run: |
          set -euo pipefail
          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "::error::Room's processor for iOS did not write $SCHEMA_FILE: the schema export"
            echo "::error::did not run for the iPhone (room.schemaLocation in shared-data/build.gradle.kts)."
            exit 1
          fi
          dirty=$(git status --porcelain -- app/schemas)
          if [ -n "$dirty" ]; then
            echo "$dirty"
            git diff -- app/schemas | head -100
            echo "::error::Room's processor for iOS exported a schema that differs from app/schemas/."
            exit 1
          fi

      - name: Shared tests (JVM) and the iOS compile
        run: >-
          ./gradlew
          :shared:testAndroidHostTest :shared:compileKotlinIosSimulatorArm64 :shared:compileTestKotlinIosSimulatorArm64
          :shared-data:testAndroidHostTest :shared-data:compileKotlinIosSimulatorArm64
          :shared-data:compileTestKotlinIosSimulatorArm64
          :shared-ui:testAndroidHostTest :shared-ui:compileKotlinIosSimulatorArm64
          :shared-ui:compileTestKotlinIosSimulatorArm64

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-shared
          path: |
            shared/build/reports/
            shared/build/test-results/
            shared-data/build/reports/
            shared-data/build/test-results/
            shared-ui/build/reports/
            shared-ui/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shared
          path: shared*/build/test-results/testAndroidHostTest/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Shared tests (JVM)
          report_paths: shared*/build/test-results/testAndroidHostTest/*.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

  # The same tests on an iOS simulator, and the `Shared` framework the iPhone app links, on a
  # GitHub-hosted macOS runner, because only Xcode links an Apple binary and runs a simulator. The
  # repository is public, so macOS runners cost nothing, and a fork's code runs on GitHub's machine,
  # never on anybody's own (owner decision, 1 November 2026: this replaced the self-hosted Mac of
  # docs/IOS-RUNNER.md, which stays as a fallback). Gated like the Linux job, on `shared`.
  # `macos-latest` rather than a numbered image, so the job never names an image GitHub retired;
  # the "Xcode" step prints which one ran. Kotlin 2.3.21 built and ran these tests on the image's
  # Xcode 26 and, on the owner's Mac, on Xcode 27.2 (ROADMAP MON-24); Kotlin 2.4.21, since Task 13,
  # supports Xcode up to 26.4.
  shared-ios:
    name: Shared — iOS simulator tests and framework (macOS)
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: macos-latest
    # 75, not 45: since Task 9 the link compiles Compose Multiplatform and skiko for Kotlin/Native
    # too: a run whose pods missed the cache spent 34 minutes before the tests, and slice 9b's
    # full run (4 November 2026) stopped at 45 inside the framework link after its tests passed.
    timeout-minutes: 75
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The Kotlin/Native compiler and its dependencies, as in the Linux job: a few hundred MB that
      # would otherwise download on every run.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts') }}

      # Gradle configures every project before it runs a task, and `:app` and the three shared
      # modules all apply the Android plugin, which fails configuration with "SDK location
      # not found" when no ANDROID_HOME or local.properties names one, even when only iOS tasks
      # were asked for.
      # The action's default package list includes the long-retired `tools`, which the current
      # sdkmanager refuses ("Failed to find package 'tools'"), so name only what exists.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' | sed 's/ *$//' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # `:shared-data` links the Firebase iOS SDK through the Kotlin CocoaPods plugin (MON-24 phase 2,
      # Task 8a): GitLive's bindings name the pods, `pod install` fetches them and `xcodebuild`
      # builds them before the test executable links. The hosted image has CocoaPods; installed only
      # when it does not, so an image without it still runs.
      - name: CocoaPods
        run: |
          pod --version || sudo gem install cocoapods
          pod --version

      # What decides the pods: their names, their version and the deployment target, as
      # `shared-data/build.gradle.kts` states them. The cache key hashes these lines alone, so an edit
      # elsewhere in that file (the next slices make many) keeps the cache.
      - name: Firebase pods' spec
        id: podspec
        run: |
          grep -E 'val firebaseIosVersion =|ios\.deploymentTarget =|listOf\("Firebase' shared-data/build.gradle.kts > "$RUNNER_TEMP/firebase-pods.txt"
          cat "$RUNNER_TEMP/firebase-pods.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/firebase-pods.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The pods compile from source — FirebaseFirestoreInternal alone is a large C++ build — about
      # 20 minutes cold (the Firebase spike, task 1). Cached: CocoaPods' download cache and specs,
      # the plugin's synthetic Pods project under `shared-data/build/cocoapods` (so `pod install`
      # finds its pods in place, with the times `xcodebuild` compares), and Xcode's derived data,
      # where `xcodebuild` keeps what it built, so a warm run builds nothing again. Keyed on the
      # Xcode version and the pods' spec above; a near miss (another Xcode, another pod list) still
      # restores what it can through the prefixes, and `xcodebuild` rebuilds only what changed.
      - name: Restore the Firebase pods
        id: pods
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ~/Library/Developer/Xcode/DerivedData
            shared-data/build/cocoapods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.podspec.outputs.hash }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            pods-${{ runner.os }}-${{ runner.arch }}-

      # `:shared-data`'s test executable links the Firebase frameworks, so this step is where the
      # pods are installed and built. Its own step, so the cache below is saved exactly when the
      # pods were built — never after a compile error stopped Gradle before them, which would save
      # a cache without them under the key and keep every later run from saving a good one.
      - name: Build the Firebase pods and link the iOS test executable
        id: link
        run: ./gradlew :shared-data:linkDebugTestIosSimulatorArm64

      # The iPhone app's one framework, `Shared`, is `:shared-ui`'s (MON-24 phase 2, Task 9): static,
      # exporting `:shared` and `:shared-data`, neither of which makes one of its own any more.
      - name: Shared tests (iOS simulator) and the framework
        run: ./gradlew :shared:iosSimulatorArm64Test :shared-data:iosSimulatorArm64Test :shared-ui:linkDebugFrameworkIosSimulatorArm64

      - name: Pods resolved
        if: always()
        run: find shared-data/build/cocoapods -name Podfile.lock -exec grep -E "^  - Firebase" {} \; | sort -u || true

      # Saved when the pods were built and the key was not already restored exactly, whatever the
      # tests then did, so a red run does not pay the cold build again.
      - name: Save the Firebase pods
        if: always() && steps.link.outcome == 'success' && steps.pods.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ~/Library/Developer/Xcode/DerivedData
            shared-data/build/cocoapods
          key: ${{ steps.pods.outputs.cache-primary-key }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-shared-ios
          path: |
            shared/build/reports/
            shared/build/test-results/
            shared-data/build/reports/
            shared-data/build/test-results/
            shared-ui/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shared-ios
          path: shared*/build/test-results/iosSimulatorArm64Test/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Shared tests (iOS simulator)
          report_paths: shared*/build/test-results/iosSimulatorArm64Test/*.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

  # The iPhone app built and launched (MON-24 phase 3): XcodeGen writes the Xcode project from
  # `iosApp/project.yml`, `xcodebuild` builds it for a simulator — its first build phase runs
  # `:shared-ui:embedAndSignAppleFrameworkForXcode`, the same Gradle call the owner's Xcode makes,
  # and Swift Package Manager brings the Firebase iOS SDK 11.8.0 the static `Shared` framework links
  # against — and `iosApp/scripts/simulator.sh` installs it, launches it, fails unless it is still
  # running 20 s later, and saves a screenshot as the `ios-launch` artifact.
  #
  # No `GoogleService-Info.plist` exists in CI (and none is ever committed), so the app runs on its
  # emulator configuration, `demo-coplanly` on 127.0.0.1, and no emulator runs here: its Firestore
  # listeners fail quietly and it must stay alive regardless. It never reaches production.
  #
  # The simulator is chosen at run time from what the image has, "iPhone 16" when it exists, and
  # the Xcode is the image's default, as `shared-ios`'s is (the "Xcode" step prints both).
  #
  # Then the iPhone tests that need the Firebase emulators (Task 5: the e-mail sign-in, the account
  # switch and `:shared-ui`'s simulator tests, which run nowhere else), inside `firebase
  # emulators:exec` on project `demo-coplanly`, as the `e2e` and `web` jobs run theirs: Node 22 and the
  # Firebase CLI `firestore-tests/` pins, the emulators on JDK 21 through FIREBASE_JAVA_HOME, Gradle
  # on 17. The test executables link the Firebase pods `:shared-data` builds through CocoaPods, as in
  # `shared-ios`, whose pod cache this job restores. Published as the check run "iPhone tests on the
  # emulators". Still no secret: nothing here reaches a real project.
  #
  # 120 minutes: the app's build and launch took about 30 in Task 4, and a run whose pods missed the
  # cache builds them cold (about 20, see `shared-ios`) before linking two test executables (each
  # several minutes, `:shared-ui`'s with Compose Multiplatform and skiko).
  ios-app:
    name: iPhone app — build and launch (macOS)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    # 180 since the native shell's UI test (MON-24 phase 3, Task 8) joined the job: when the
    # Firebase pods' cache misses (a new Xcode on the image), the emulator tests' step builds them
    # cold, which took 77 minutes for Firestore's alone on 11 November 2026, and 120 ended the job
    # before its tests had run.
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Firebase emulators)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up JDK 17 (Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firestore-tests/package-lock.json

      # `functions/` is what the Functions emulator loads; `firestore-tests/` pins the Firebase CLI
      # the rules, e2e and web jobs run their emulators on.
      - name: Install the Cloud Functions and the Firebase CLI
        run: |
          npm ci --prefix functions
          npm ci --prefix firestore-tests

      # The Firestore and Storage emulators are jars the CLI downloads on first use, as in `rules`.
      - name: Cache the Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      # No `cache-encryption-key`, unlike the other Gradle jobs: this job builds third-party Swift
      # packages, so it gets no secret. Its one Gradle call runs inside `xcodebuild`, where the
      # configuration cache gains little across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # As in `shared-ios`: the Kotlin/Native compiler and its dependencies.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts') }}

      # As in `shared-ios`: Gradle configures every project, and `:app` and the shared modules apply
      # the Android plugin, which fails configuration without an SDK location.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Xcode
        id: xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' | sed 's/ *$//' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # As in `shared-ios`: the test executables link the Firebase pods `:shared-data` builds.
      - name: CocoaPods
        run: |
          pod --version || sudo gem install cocoapods
          pod --version

      # The same key as `shared-ios`, from the same lines of `shared-data/build.gradle.kts`.
      - name: Firebase pods' spec
        id: podspec
        run: |
          grep -E 'val firebaseIosVersion =|ios\.deploymentTarget =|listOf\("Firebase' shared-data/build.gradle.kts > "$RUNNER_TEMP/firebase-pods.txt"
          cat "$RUNNER_TEMP/firebase-pods.txt"
          echo "hash=$(shasum -a 256 "$RUNNER_TEMP/firebase-pods.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Restore only: `shared-ios` saves this key, and two jobs saving it would race. On a miss the
      # pods build cold in the test step below.
      - name: Restore the Firebase pods
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ~/Library/Developer/Xcode/DerivedData
            shared-data/build/cocoapods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.podspec.outputs.hash }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            pods-${{ runner.os }}-${{ runner.arch }}-

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: cd iosApp && xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(iosApp/scripts/simulator.sh pick)" >> "$GITHUB_OUTPUT"

      # The Firebase iOS SDK's sources and binary frameworks, as Swift Package Manager resolves them
      # under the derived data path. Keyed on the project spec, which pins the version.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: iosApp/build/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iosApp/project.yml') }}

      - name: Build the app
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p iosApp/build
          xcodebuild \
            -project iosApp/CoPlanly.xcodeproj \
            -scheme CoPlanly \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath iosApp/build \
            build-for-testing 2>&1 | tee iosApp/build/xcodebuild.log

      - name: Launch it on the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          iosApp/scripts/simulator.sh launch "$UDID" \
            iosApp/build/Build/Products/Debug-iphonesimulator/CoPlanly.app iosApp/build/launch

      # The native shell (MON-24 phase 3, Task 8): CoPlanlyUITests signs in by e-mail as a parent of a
      # family seeded on fresh emulators (tools/ios/seed-shell-family.js), walks Home, Family, Expenses,
      # the Add expense sheet and Settings with a screenshot of each, and checks the shell's review
      # points: a back swipe, one let go of, a tab tap popping two screens, and a sheet with an edit
      # swiped down asking "Discard changes?". The screenshots are the `ios-shell` artifact. Before the
      # emulator tests, on emulators of its own, so a shell failure shows without waiting for them.
      - name: The native shell on the emulators (XCUITest)
        id: shell-test
        env:
          FIREBASE_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          export PATH="$FIREBASE_JAVA_HOME/bin:$PATH"
          firestore-tests/node_modules/.bin/firebase emulators:exec \
            --only auth,firestore,functions,storage \
            --project demo-coplanly \
            "iosApp/scripts/simulator.sh shell-test $UDID iosApp/build/shell" \
            2>&1 | tee "$RUNNER_TEMP/shell-test.log"

      # The simulator hands a test process only `SIMCTL_CHILD_`-prefixed variables, without the
      # prefix: both forms are exported here, and the two modules' build files also forward the plain
      # names that way (`KotlinNativeSimulatorTest`), so the tests read COPLANLY_EMULATOR_HOST
      # either way. `--continue` runs `:shared-ui`'s tests even when `:shared-data`'s fail, and
      # `--rerun` runs each even when Gradle's cache holds a result: the write gate must write.
      #
      # The write gate (MON-24 phase 3, Task 7) is two halves in one emulator session. The tests
      # include `IosWriteGateTest`, whose two iPhone data layers write every kind of shared record and
      # list each document written in COPLANLY_GATE_OUTPUT; then, before the emulators stop,
      # `tools/ios/check-ios-writes.js` reads each of those documents back from the Firestore emulator
      # (loopback only) and compares its keys and Firestore types with what Android writes
      # (`wire/current/`, or a literal shape from the shared writer). Both must pass; the checker
      # runs even when the tests failed, so its findings are in the same log.
      - name: iPhone tests on the emulators
        id: emulator-tests
        env:
          FIREBASE_JAVA_HOME: ${{ steps.jdk21.outputs.path }}
          COPLANLY_EMULATOR_HOST: 127.0.0.1
          COPLANLY_REQUIRE_EMULATORS: '1'
          COPLANLY_GATE_OUTPUT: ${{ github.workspace }}/build/ios-gate/written.txt
          SIMCTL_CHILD_COPLANLY_EMULATOR_HOST: 127.0.0.1
          SIMCTL_CHILD_COPLANLY_REQUIRE_EMULATORS: '1'
          SIMCTL_CHILD_COPLANLY_GATE_OUTPUT: ${{ github.workspace }}/build/ios-gate/written.txt
          # The simulator the app was launched on, still booted: the tests run there rather than
          # `--standalone`, where no Keychain is available (see the modules' build files).
          COPLANLY_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          export PATH="$FIREBASE_JAVA_HOME/bin:$PATH"
          rm -f "$COPLANLY_GATE_OUTPUT"
          firestore-tests/node_modules/.bin/firebase emulators:exec \
            --only auth,firestore,functions,storage \
            --project demo-coplanly \
            './gradlew --continue :shared-data:iosSimulatorArm64Test --rerun :shared-ui:iosSimulatorArm64Test --rerun; tests=$?; node tools/ios/check-ios-writes.js --emulator 127.0.0.1:8080 --fixtures app/src/test/resources/wire/current --written "$COPLANLY_GATE_OUTPUT"; checker=$?; echo "tests: $tests, write gate checker: $checker"; [ "$tests" -eq 0 ] && [ "$checker" -eq 0 ]' \
            2>&1 | tee "$RUNNER_TEMP/emulator-tests.log"

      # A test that finds no emulator host returns at once, so a run where the variables never
      # reached the simulator would pass by testing nothing: every emulator test prints what it did
      # (`AuthEmulator` in shared-data's iosTest), and none may have skipped.
      - name: The emulator tests reached the emulators
        if: always() && steps.emulator-tests.outcome != 'skipped'
        run: |
          shopt -s nullglob
          sources=("$RUNNER_TEMP/emulator-tests.log" shared-data/build/test-results/iosSimulatorArm64Test/*.xml shared-ui/build/test-results/iosSimulatorArm64Test/*.xml)
          if grep -h "COPLANLY_EMULATOR_TEST_SKIPPED" "${sources[@]}"; then
            echo "::error::An emulator test skipped itself: the emulator host did not reach the simulator."
            exit 1
          fi
          ran=$(grep -ho "COPLANLY_EMULATOR_TEST_RAN [a-z ]*" "${sources[@]}" | sort -u)
          echo "$ran"
          if [ -z "$ran" ]; then
            echo "::error::No emulator test reported that it ran."
            exit 1
          fi
          if ! grep -q "COPLANLY_EMULATOR_TEST_RAN write gate" <<< "$ran"; then
            echo "::error::The write gate (IosWriteGateTest) did not report that it ran."
            exit 1
          fi

      - name: Upload the shell's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell
          path: |
            iosApp/build/shell/shots/
            iosApp/build/shell/shell.xcresult
            ${{ runner.temp }}/shell-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the launch screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch
          path: iosApp/build/launch/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the emulator tests' reports and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-ios-emulators
          path: |
            shared-data/build/reports/
            shared-ui/build/reports/
            build/ios-gate/
            ${{ runner.temp }}/emulator-tests.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ios-emulators
          path: shared-*/build/test-results/iosSimulatorArm64Test/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test check run
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: iPhone tests on the emulators
          report_paths: shared-*/build/test-results/iosSimulatorArm64Test/*.xml
          detailed_summary: true
          # A job that died before writing results must not publish a green check.
          require_tests: true

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: iosApp/build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

  # One sticky comment per pull request, edited on every run, saying what CI found — so a result
  # can be read without opening a log, by a person or by an assistant reading the PR through the
  # API (the comment also carries the facts as JSON in an HTML comment; see tools/ci-report.js).
  #
  # It lists the run's jobs from the API rather than from `needs`, so a job added to this file
  # later shows up without touching this one — but it only *waits* for the jobs in `needs`. Add a
  # new job there too, or its row may read "in progress". `if: always()` because a failed run is
  # exactly when the comment matters; the job itself never fails over the report. On a push to
  # `main` there is no pull request: the summary goes to the run's job summary only.
  report:
    name: CI report
    needs: [changes, build-test, static, detekt, release, r8-runtime, screenshots, instrumented, e2e, upgrade, invariants, functions, web, rules, shared, shared-ios, ios-app]
    # Not for the run an unrelated label starts: it built nothing and would replace the real run's
    # comment with an empty one.
    if: always() && needs.changes.outputs.unrelated_label != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read        # list the run's jobs and artifacts
      pull-requests: write # the sticky comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No test results is a real state (a docs-only PR skips the Android jobs), not an error.
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: ci-artifacts

      - name: Download coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ci-artifacts/coverage-report

      # Verify or record, and which images no longer match their baselines. Absent when the
      # screenshots job was skipped, which the report treats as "not reported".
      - name: Download the screenshot summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: screenshot-summary
          path: ci-artifacts/screenshot-summary

      - name: Manual test plan from the changed paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/manual-test-plan.js --base "$BASE_SHA" --head "$HEAD_SHA" --ref "$HEAD_SHA" \
            --out "$RUNNER_TEMP/manual-test-plan.md" \
            || echo "::warning::Could not build the manual test plan."

      - name: Build the summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT_JOB_NAME: CI report
          EMULATORS_SKIPPED_ON_DRAFT: ${{ needs.changes.outputs.emulators_skipped_on_draft }}
        run: |
          node tools/ci-report.js --artifacts ci-artifacts \
            --plan "$RUNNER_TEMP/manual-test-plan.md" --out "$RUNNER_TEMP/ci-summary.md"

      # Fork pull requests get a read-only token and cannot comment; the job summary above
      # still has everything, so a refusal here is not a failure.
      - name: Post or update the sticky PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-summary
          path: ${{ runner.temp }}/ci-summary.md
