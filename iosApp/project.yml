# The iPhone app's Xcode project (MON-24 phase 3), generated by XcodeGen 2.x:
#
#   cd iosApp && xcodegen generate
#
# The generated `CoPlanly.xcodeproj/` is not committed (.gitignore); this file is the project.
# See iosApp/README.md for running it, and the `ios-app` job in .github/workflows/ci.yml for CI.
name: CoPlanly

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # The Android app's versionName (app/build.gradle.kts); move them together.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # The Firebase iOS SDK GitLive 2.7.0's bindings were generated against (`firebaseIosVersion` in
  # shared-data/build.gradle.kts): the `Shared` framework is static and carries GitLive's references
  # to these symbols, which the app resolves by linking the products below. Move with GitLive.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "11.8.0"
  # Google's sign-in sheet (MON-24 phase 3, Task 9; GoogleSignInBridge.swift). 9.2.0 needs iOS 12 and
  # shares only Firebase's own ranges (GoogleUtilities 8, AppCheckCore 11, GTMSessionFetcher 3) with
  # Firebase 11.8.0. Pinned exactly, as Firebase is.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.2.0"

targets:
  CoPlanly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Everything in the folder: the Swift entry point, the asset catalogue, the five languages'
      # InfoPlist.strings (the camera question, part C, Task 11) and, when the owner has dropped it
      # there, GoogleService-Info.plist (never committed). Info.plist and the entitlements are read
      # through the settings below, not copied.
      - path: CoPlanly
        excludes:
          - Info.plist
          - CoPlanly.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      # The sign-in (MON-24 phase 3, Task 5): GitLive's Auth bindings in `Shared` call it.
      - package: Firebase
        product: FirebaseAuth
      # Cloud Storage (MON-24 phase 3, part C, Task 10): GitLive's Storage bindings in `Shared` call it.
      - package: Firebase
        product: FirebaseStorage
      # Pushes (MON-24 phase 4, part C, Task 5): the FCM token the app keeps on the profile
      # (PushTokenBridge.swift). From the same Firebase package, never a CocoaPod.
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      # The Notification Service Extension (iPhone phase 4 part C, Task 6), embedded in PlugIns.
      - target: CoPlanlyNotifications
        embed: true
      # The Today widget (iPhone phase 4 part D, Task 5), embedded in PlugIns.
      - target: CoPlanlyWidget
        embed: true
    preBuildScripts:
      # Builds `Shared` for the configuration and simulator or device Xcode is building, into
      # shared-ui/build/xcode-frameworks/<configuration>/<sdk>, which FRAMEWORK_SEARCH_PATHS names.
      - name: Build the Shared framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # The app's URL schemes, written into the built Info.plist after Xcode has processed it and
      # before signing. First the app's own, `coplanly`, which every build registers: the
      # `coplanly://pair`, `guest` and `chat` links Android's manifest declares (`IosApp.openUrl`).
      # Then Google's sign-in's, which returns through the reversed client id of the bundled
      # GoogleService-Info.plist, which only the owner's Mac has (never committed): the build setting
      # COPLANLY_GOOGLE_URL_SCHEME when it is set, else read from that file when it is there; with
      # neither (CI, the emulators) Google's is not added, and GoogleSignInBridge offers no Google.
      - name: Register the app's URL schemes
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            -c "Add :CFBundleURLTypes:0 dict" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string app.coplanly" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string coplanly" \
            "$plist"
          echo "Registered the coplanly URL scheme."
          scheme="${COPLANLY_GOOGLE_URL_SCHEME}"
          google="${SRCROOT}/CoPlanly/GoogleService-Info.plist"
          if [ -z "$scheme" ] && [ -f "$google" ]; then
            scheme=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$google" 2>/dev/null || true)
          fi
          if [ -z "$scheme" ]; then
            echo "No Google URL scheme: the app offers e-mail sign-in alone."
            exit 0
          fi
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:1 dict" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLName string google" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $scheme" \
            "$plist"
          echo "Registered Google's URL scheme."
      # The notifications' strings (iPhone phase 4 part C): `PushStrings.strings` and `.stringsdict`
      # in each `<lang>.lproj`, written from `:shared-ui`'s XML for the keys `push-wording/push-keys.txt`
      # lists, as the extension's own phase writes them into the extension. The app words its local
      # notifications (event and support reminders) with the same `BundleWordingStrings` over its
      # own bundle. Node must be on the PATH (CI's is; Homebrew's two prefixes are added for Xcode).
      - name: Write the notifications' strings
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          cd "$SRCROOT/.."
          node tools/ios/generate-push-strings.js "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
            --keys push-wording/push-keys.txt
    settings:
      base:
        PRODUCT_NAME: CoPlanly
        PRODUCT_BUNDLE_IDENTIFIER: app.coplanly
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # iPhone only; portrait only is Info.plist's UISupportedInterfaceOrientations.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: CoPlanly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CoPlanly/CoPlanly.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        # The Gradle phase reads and writes outside the sandbox Xcode gives a script; Kotlin's
        # embedAndSign task refuses to run inside it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin builds the framework for arm64 alone (iosArm64, iosSimulatorArm64).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # `Shared` is static: the app links it, and SQLite for Room's driver.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          - "-lsqlite3"
        # What AppDelegate hands the shared code (IosAppConfig), through Info.plist. Blank hides a
        # link or leaves the choice of Firebase to the bundled configuration. The addresses are the
        # Android build's published ones (app/build.gradle.kts); the support address is blank there.
        # The export's verification page (CoPlanlyExportVerifyUrl, read by the shared code's
        # InfoPlistExportVerifyAddress) is blank too, as on Android until web/verify/ is hosted.
        COPLANLY_EMULATOR_HOST: ""
        COPLANLY_PRIVACY_POLICY_URL: "https://coparently-a39c9.web.app/privacy/"
        COPLANLY_TERMS_URL: "https://coparently-a39c9.web.app/terms/"
        COPLANLY_SUPPORT_EMAIL: ""
        COPLANLY_EXPORT_VERIFY_URL: ""
        # Google's sign-in URL scheme (the "Register the app's URL schemes" phase). Blank: read from the
        # bundled GoogleService-Info.plist when there is one. Set it only on your own Mac; never commit
        # a value.
        COPLANLY_GOOGLE_URL_SCHEME: ""
        # Google Calendar's web client (MON-24 phase 4, part A, Task 7): `Info.plist`'s GIDServerClientID,
        # the OAuth client Google issues the server's authorization code for, whose secret the
        # `exchangeGoogleAuthCode` function holds (Android's `default_web_client_id`). Blank: Settings
        # offers no Google Calendar row (GoogleSignInBridge.calendarAvailable), as in CI. A client id is
        # not a secret, but set it on your own Mac or the release build only, as the URL scheme.
        COPLANLY_GOOGLE_WEB_CLIENT_ID: ""
        # Pushes (MON-24 phase 4, part C): `CoPlanly.entitlements` carries `aps-environment`
        # (`development`; the release build's signing decides production) and the App Group
        # `group.app.coplanly`, where the app shares the signed-in uid and its language with the
        # notification extension (`AppGroupShare.kt`). Both need the App ID's capabilities and the
        # APNs key in the Firebase console (owner steps, iosApp/README.md); a simulator build signs
        # them locally. No `remote-notification` background mode: every push carries an alert.
        # Sign in with Apple (MON-24 phase 4, part A): the `CoplanlyAppleSignIn` Info.plist key the
        # shared code reads (`AppleSignInFlag.kt`), on in Debug and off in Release until the owner
        # turns it on, as Android's `APPLE_SIGN_IN` build flag. The sheet also needs the
        # `com.apple.developer.applesignin` entitlement (CoPlanly.entitlements), which a device build
        # signs with the team's profile; a simulator build signs it locally.
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          COPLANLY_APPLE_SIGN_IN: "YES"
        Release:
          COPLANLY_APPLE_SIGN_IN: "NO"
    scheme:
      testTargets:
        - CoPlanlyUITests

  # The Notification Service Extension (iPhone phase 4 part C, Task 6; design §7.2): rewrites each
  # push's neutral alert with the sentence `:push-wording` words, in the language and for the account
  # the app shares through the App Group (CoPlanlyNotifications/NotificationService.swift). It links
  # `PushWording`, a static Kotlin framework of that module alone, built by the Gradle phase below for
  # the SDK Xcode is building (release: an extension has about 24 MB), and carries the strings in its
  # own `<lang>.lproj` folders.
  CoPlanlyNotifications:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoPlanlyNotifications
        excludes:
          - Info.plist
          - CoPlanlyNotifications.entitlements
    preBuildScripts:
      # Into push-wording/build/bin/<target>/releaseFramework, which FRAMEWORK_SEARCH_PATHS names.
      - name: Build the PushWording framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          case "$PLATFORM_NAME" in
            iphonesimulator) task=linkReleaseFrameworkIosSimulatorArm64 ;;
            iphoneos) task=linkReleaseFrameworkIosArm64 ;;
            *) echo "error: no PushWording framework for $PLATFORM_NAME"; exit 1 ;;
          esac
          ./gradlew ":push-wording:$task"
    postBuildScripts:
      - name: Write the notifications' strings
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          cd "$SRCROOT/.."
          node tools/ios/generate-push-strings.js "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
            --keys push-wording/push-keys.txt
    settings:
      base:
        PRODUCT_NAME: CoPlanlyNotifications
        # The app's id and `.notifications`, as iOS requires of an embedded extension.
        PRODUCT_BUNDLE_IDENTIFIER: app.coplanly.notifications
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CoPlanlyNotifications/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The App Group alone: the uid and the language the app shares (AppGroupShare.kt).
        CODE_SIGN_ENTITLEMENTS: CoPlanlyNotifications/CoPlanlyNotifications.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        # The Gradle phase reads and writes outside the sandbox Xcode gives a script.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]:
          - "$(inherited)"
          - "$(SRCROOT)/../push-wording/build/bin/iosSimulatorArm64/releaseFramework"
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]:
          - "$(inherited)"
          - "$(SRCROOT)/../push-wording/build/bin/iosArm64/releaseFramework"
        # `PushWording` is static: the extension links it, and nothing else of ours.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "PushWording"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES

  # The Today widget (iPhone phase 4 part D, Task 5; design §7.3): SwiftUI and WidgetKit, small and
  # medium on the home screen. It reads the snapshot the app writes into the App Group
  # (`<group container>/widget/today.json`, WidgetSnapshotWriter.kt) and draws its lines; it links no
  # Kotlin framework and no package, and has no strings of its own but the English line for a phone
  # with no snapshot yet (CoPlanlyWidget/TodayWidget.swift).
  CoPlanlyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoPlanlyWidget
        excludes:
          - Info.plist
          - CoPlanlyWidget.entitlements
    settings:
      base:
        PRODUCT_NAME: CoPlanlyWidget
        # The app's id and `.widget`, as iOS requires of an embedded extension.
        PRODUCT_BUNDLE_IDENTIFIER: app.coplanly.widget
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: CoPlanlyWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The App Group alone: the snapshot the app writes there.
        CODE_SIGN_ENTITLEMENTS: CoPlanlyWidget/CoPlanlyWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES

  # The native shell's UI test (MON-24 phase 3, Task 8), which the `ios-app` job runs on the Firebase
  # emulators with a seeded family (tools/ios/seed-shell-family.js); it reaches no real project.
  CoPlanlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoPlanlyUITests
    dependencies:
      - target: CoPlanly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coplanly.uitests
        TEST_TARGET_NAME: CoPlanly
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
