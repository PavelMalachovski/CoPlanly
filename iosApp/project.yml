# The iPhone app's Xcode project (MON-24 phase 3), generated by XcodeGen 2.x:
#
#   cd iosApp && xcodegen generate
#
# The generated `CoPlanly.xcodeproj/` is not committed (.gitignore); this file is the project.
# See iosApp/README.md for running it, and the `ios-app` job in .github/workflows/ci.yml for CI.
name: CoPlanly

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # The Android app's versionName (app/build.gradle.kts); move them together.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # The Firebase iOS SDK GitLive 2.7.0's bindings were generated against (`firebaseIosVersion` in
  # shared-data/build.gradle.kts): the `Shared` framework is static and carries GitLive's references
  # to these symbols, which the app resolves by linking the products below. Move with GitLive.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "11.8.0"
  # Google's sign-in sheet (MON-24 phase 3, Task 9; GoogleSignInBridge.swift). 9.2.0 needs iOS 12 and
  # shares only Firebase's own ranges (GoogleUtilities 8, AppCheckCore 11, GTMSessionFetcher 3) with
  # Firebase 11.8.0. Pinned exactly, as Firebase is.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "9.2.0"

targets:
  CoPlanly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Everything in the folder: the Swift entry point, the asset catalogue and, when the owner has
      # dropped it there, GoogleService-Info.plist (never committed). Info.plist and the entitlements
      # are read through the settings below, not copied.
      - path: CoPlanly
        excludes:
          - Info.plist
          - CoPlanly.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      # The sign-in (MON-24 phase 3, Task 5): GitLive's Auth bindings in `Shared` call it.
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      # Builds `Shared` for the configuration and simulator or device Xcode is building, into
      # shared-ui/build/xcode-frameworks/<configuration>/<sdk>, which FRAMEWORK_SEARCH_PATHS names.
      - name: Build the Shared framework (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared-ui:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # Google's sign-in returns through a URL scheme, the reversed client id of the bundled
      # GoogleService-Info.plist, which only the owner's Mac has (never committed). The scheme is the
      # build setting COPLANLY_GOOGLE_URL_SCHEME when it is set, else read from that file when it is
      # there; with neither (CI, the emulators) nothing is added, and GoogleSignInBridge offers no
      # Google. It writes the built Info.plist, after Xcode has processed it and before signing.
      - name: Register Google's URL scheme
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          scheme="${COPLANLY_GOOGLE_URL_SCHEME}"
          google="${SRCROOT}/CoPlanly/GoogleService-Info.plist"
          if [ -z "$scheme" ] && [ -f "$google" ]; then
            scheme=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$google" 2>/dev/null || true)
          fi
          if [ -z "$scheme" ]; then
            echo "No Google URL scheme: the app offers e-mail sign-in alone."
            exit 0
          fi
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            -c "Add :CFBundleURLTypes:0 dict" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string google" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $scheme" \
            "$plist"
          echo "Registered Google's URL scheme."
    settings:
      base:
        PRODUCT_NAME: CoPlanly
        PRODUCT_BUNDLE_IDENTIFIER: app.coplanly
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # iPhone only; portrait only is Info.plist's UISupportedInterfaceOrientations.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: CoPlanly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CoPlanly/CoPlanly.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        # The Gradle phase reads and writes outside the sandbox Xcode gives a script; Kotlin's
        # embedAndSign task refuses to run inside it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin builds the framework for arm64 alone (iosArm64, iosSimulatorArm64).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # `Shared` is static: the app links it, and SQLite for Room's driver.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
          - "-lsqlite3"
        # What AppDelegate hands the shared code (IosAppConfig), through Info.plist. Blank hides a
        # link or leaves the choice of Firebase to the bundled configuration. The addresses are the
        # Android build's published ones (app/build.gradle.kts); the support address is blank there.
        COPLANLY_EMULATOR_HOST: ""
        COPLANLY_PRIVACY_POLICY_URL: "https://coparently-a39c9.web.app/privacy/"
        COPLANLY_TERMS_URL: "https://coparently-a39c9.web.app/terms/"
        COPLANLY_SUPPORT_EMAIL: ""
        # Google's sign-in URL scheme (the "Register Google's URL scheme" phase). Blank: read from the
        # bundled GoogleService-Info.plist when there is one. Set it only on your own Mac; never commit
        # a value.
        COPLANLY_GOOGLE_URL_SCHEME: ""
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    scheme:
      testTargets:
        - CoPlanlyUITests

  # The native shell's UI test (MON-24 phase 3, Task 8), which the `ios-app` job runs on the Firebase
  # emulators with a seeded family (tools/ios/seed-shell-family.js); it reaches no real project.
  CoPlanlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoPlanlyUITests
    dependencies:
      - target: CoPlanly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.coplanly.uitests
        TEST_TARGET_NAME: CoPlanly
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
