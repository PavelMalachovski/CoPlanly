<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChatBubble — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
<style>#root{padding:16px;box-sizing:border-box} .w{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}</style></head>
<body>
<div id="root"></div>
<script>
  var C = window.CoPlanly, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'w',style:{gap:2}},
 h(C.ChatDaySeparator,{label:'Today'}),
 h(C.ChatBubble,{text:'Can you take Emma to swimming on Friday instead of Thursday?',time:'09:12',startsGroup:true,endsGroup:false}),
 h(C.ChatBubble,{text:'The pool is closed on Thursday.',time:'09:12',startsGroup:false,endsGroup:true}),
 h(C.ChatBubble,{mine:true,text:'Yes, Friday works.',time:'09:20',status:'read'}),
 h(C.ChatBubble,{mine:true,text:'Swimming lesson moved to Fri 24 Oct, 17:00',time:'09:21',status:'delivered',onOpen:function(){}}),
 h(C.ChatBubble,{mine:true,text:'I\u2019ll pack her towel.',time:'09:22',status:'error'})));
</script>
</body>
</html>
